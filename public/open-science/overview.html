n-top:8px;font-size:15px;line-height:1.2;padding:0 0 4px}\nhtml[lang=\"en\"] .ecosystem .content{margin-top:20px}\nhtml[lang=\"en\"] .ecosystem .gallery-frame{height:285px}\nhtml[lang=\"en\"] .ecosystem .skill-points{margin-top:8px}\nhtml[lang=\"en\"] .ecosystem .skill-points p{padding:6px 0;font-size:14px;line-height:1.4}\nhtml[lang=\"en\"] .architecture .content{margin-top:8px}\nhtml[lang=\"en\"] .architecture-layers{padding-top:0;width:620px}\nhtml[lang=\"en\"] .architecture-layer{padding:7px 0}\nhtml[lang=\"en\"] .architecture-layer h3{font-size:23px}\nhtml[lang=\"en\"] .architecture-layer p{font-size:15.5px;line-height:1.35;margin-top:4px;white-space:nowrap}\nhtml[lang=\"en\"] .architecture-layer .en{margin-bottom:5px}\n@media(max-width:650px){.key-hint{display:none}.controls{bottom:9px;right:50%;transform:translateX(50%);opacity:.8}.controls button{padding:0 7px;min-width:29px}.overview-grid{grid-template-columns:1fr}dialog{padding:23px}.help-list{grid-template-columns:1fr}.nav-context{display:none}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n@page{size:1600px 900px;margin:0}\n@media print{html,body{height:auto;overflow:visible;background:#fff}#viewport{position:static;display:block}#deck{width:1600px;height:auto;transform:none;overflow:visible}.slide,.slide.active{position:relative;display:flex!important;width:1600px;height:900px;break-after:page;page-break-after:always;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slide:last-of-type{break-after:auto}.controls,.key-hint,.nav-bar,.progress-bar-nav,dialog,.toast{display:none!important}.gallery-panel:not(.active){display:none!important}.summary{bottom:45px}.slide:after{content:attr(data-page)\" / 15\";position:absolute;right:40px;bottom:20px;font:12px var(--mono);color:var(--sub)}}\n</style>\n</head>\n<body>\n<noscript><div class=\"no-js\">Open this presentation in a browser with JavaScript enabled.</div></noscript>\n<div id=\"viewport\"><main id=\"deck\" aria-label=\"AIPOCH Open-Science product introduction\">\n<div class=\"progress-bar-nav\"><div id=\"progressFill\" class=\"progress-bar-fill\"></div></div>\n<nav class=\"nav-bar\" aria-label=\"Brand\"><a class=\"nav-logo\" href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\"><span class=\"brand-mark\"><img src=\"/open-science/assets/e3824afb44bd1b7c.png\" alt=\"\"></span>AIPOCH</a><div class=\"nav-context\">OPEN-SCIENCE · PRODUCT & COMMUNITY · 2026.08</div></nav>\n\n<section class=\"slide slide-dark cover active\" data-page=\"01\" data-title=\"AIPOCH · Open-Science\" aria-label=\"Slide 1: AIPOCH Open-Science\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div>\n <img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"Architectural linework representing open research infrastructure\">\n <div class=\"brand-lead\">AIPOCH <span style=\"font:12px var(--mono);letter-spacing:.17em;color:#aaa;vertical-align:middle;margin-left:22px\">AI4SCIENCE</span></div>\n <h1 class=\"hero-title\"><span class=\"highlight-text en\">Open-Science</span></h1>\n <p class=\"cover-sub\">An open-source, model-agnostic workbench for real research</p>\n <p class=\"manifesto\">Put research expertise to work.<br>On your terms.</p>\n <span class=\"radar-node decor\" style=\"left:1120px;top:252px\"></span><span class=\"radar-node decor\" style=\"left:1455px;top:482px\"></span><span class=\"radar-node decor\" style=\"left:1230px;top:706px\"></span>\n <div class=\"cover-meta\">OPEN BY DESIGN. BUILT WITH THE RESEARCH COMMUNITY.</div>\n <p class=\"cover-label\">A shared workbench for<br>a global open research community</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">AIPOCH is building Open-Science so researchers everywhere can use, inspect and improve scientific capabilities together.</p><p>The opening establishes the relationship between the company and the product. AIPOCH is an AI4Science company; Open-Science is its open-source, model-agnostic workbench for researchers. This presentation focuses on the product, the capabilities it brings together and the community growing around it.</p><p>“Model-agnostic” means researchers can choose models, providers and deployment paths. It does not mean the product works without models or that third-party inference and compute are free.</p><div class=\"sources\">[Sources]<br>Company and product definitions supplied by AIPOCH. Architecture artwork: AIPOCH 2026 mid-year review. Visual reference: AIPOCH — Skill Infrastructure for Medical Research.</div></aside>\n</section>\n\n<section class=\"slide\" data-page=\"02\" data-title=\"Scientific expertise, made executable\">\n <div class=\"kicker\">01 / ABOUT AIPOCH</div>\n <h2 class=\"section-title\">Scientific expertise, <span class=\"highlight-text\">made executable</span></h2>\n <p class=\"mission-intro\">AIPOCH builds AI4Science products that pair machine computation and reasoning with the judgment researchers develop through years of practice. We turn scattered knowledge, tools and workflows into scientific capabilities that can be run, inspected and reused.</p>\n <div class=\"mission-formula\">\n  <div class=\"formula-part\"><span class=\"label\">MACHINE INTELLIGENCE</span><div class=\"en-big\">AI Compute<br>& Reasoning</div><div class=\"cn\">Compute · Reason · Execute</div></div><div class=\"formula-symbol\">×</div>\n  <div class=\"formula-part\"><span class=\"label\">HUMAN EXPERTISE</span><div class=\"en-big\">Research<br>Judgment</div><div class=\"cn\">Methods · Standards · Boundaries</div></div><div class=\"formula-symbol\">→</div>\n  <div class=\"formula-part formula-result\"><span class=\"label\" style=\"color:#655b2b\">SCIENTIFIC CAPABILITY</span><div class=\"en-big\">Knowledge you can run.<br>Expertise you can reuse.</div><div class=\"cn\">Tested and refined in real research</div></div>\n </div>\n <p class=\"summary\">Put proven research practice to work, so the next study doesn't start from scratch.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">AIPOCH turns expert practice into capability researchers can actually call and run.</p><p>AI contributes computation, reasoning, information processing and execution. Researchers contribute methods, domain knowledge, standards of judgment and boundaries of use. Together, they allow scientific know-how to enter real tasks, be inspected and be reused across studies.</p><p>Open-Science is where researchers use these capabilities—and where the community can improve them over time.</p><div class=\"sources\">[Sources]<br>AIPOCH company definition and product materials supplied for the 2026 mid-year review.</div></aside>\n</section>\n\n<section class=\"slide slide-surface\" data-page=\"03\" data-title=\"A better model won't fix a broken research workflow\">\n <div class=\"kicker\">02 / THE RESEARCH GAP</div>\n <h2 class=\"section-title\">A better model won't fix<br><span class=\"highlight-text\">a broken research workflow</span></h2>\n <p class=\"subtitle\">The hard part is keeping evidence, methods, tools, compute and outputs connected.</p>\n <div class=\"fragmented\">\n  <div class=\"fragment\"><div class=\"index\">01</div><h3>Question</h3><div class=\"en\">INTENT</div><p class=\"gap-note\">Research goals<br>restated in every tool</p></div>\n  <div class=\"fragment\"><div class=\"index\">02</div><h3>Evidence</h3><div class=\"en\">SOURCES</div><p class=\"gap-note\">Papers and datasets<br>scattered across systems</p></div>\n  <div class=\"fragment\"><div class=\"index\">03</div><h3>Method</h3><div class=\"en\">DESIGN</div><p class=\"gap-note\">Expert practice<br>often undocumented</p></div>\n  <div class=\"fragment\"><div class=\"index\">04</div><h3>Analysis</h3><div class=\"en\">EXECUTION</div><p class=\"gap-note\">Code and environments<br>difficult to reproduce</p></div>\n  <div class=\"fragment\"><div class=\"index\">05</div><h3>Validation</h3><div class=\"en\">CHECKS</div><p class=\"gap-note\">Methods and outputs<br>hard to reconcile</p></div>\n  <div class=\"fragment\"><div class=\"index\">06</div><h3>Outputs</h3><div class=\"en\">ARTIFACTS</div><p class=\"gap-note\">Files and provenance<br>difficult to reuse</p></div>\n </div>\n <p class=\"problem-foot\">What gets lost: <span style=\"color:#111\">context, continuity, execution state and provenance</span></p>\n <p class=\"summary\">A research workbench should carry the work forward, not reset at every tool boundary.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Research needs an environment that carries the work forward across tools, sessions and execution steps.</p><p>This is not a claim that every AI chat tool is unable to execute. The point is that research still depends on persistent context, specialist methods, compute and validation. Researchers are often left to move information, configure environments, check methods and assemble outputs themselves.</p><div class=\"sources\">[Sources]<br>Narrative confirmed by AIPOCH; structure adapted from the “Fragmented Research Workflow” in the reference deck.</div></aside>\n</section>\n\n<section class=\"slide\" data-page=\"04\" data-title=\"Start with a question. Get straight to the work.\">\n <div class=\"kicker\">03 / MEET OPEN-SCIENCE</div>\n <h2 class=\"section-title\">Start with a question.<br><span class=\"highlight-text\">Get straight to the work.</span></h2>\n <p class=\"subtitle\">Open-Science brings models, specialist expertise and real research workflows into one place.</p>\n <div class=\"content split wide-visual\">\n  <div class=\"overview-copy\"><p class=\"body-text\">Open-Science is AIPOCH’s open-source, model-agnostic workbench for research.<br><br>Choose the tools that fit the study. Run them in a transparent, controlled environment, with a complete record of what happened.</p><div class=\"key-values\"><div class=\"key-value\"><b>Open source</b><span>CODE YOU CAN INSPECT</span></div><div class=\"key-value\"><b>Model-agnostic</b><span>CHOOSE WHAT FITS</span></div><div class=\"key-value\"><b>Transparent</b><span>SEE EACH STEP</span></div><div class=\"key-value\"><b>Reproducible</b><span>KEEP CONTEXT &amp; RECORDS</span></div></div></div>\n  <div><figure class=\"crop shot workbench-home full-gif\"><img alt=\"Open-Science home: running research tasks, project workspaces and recent sessions\" src=\"/open-science/assets/d3c983de7250f454.gif\"><span class=\"gif-bottom-mask left\" aria-hidden=\"true\"></span><span class=\"gif-bottom-mask right\" aria-hidden=\"true\"></span></figure><div class=\"shot-caption\"><span>OPEN-SCIENCE · PROJECTS & SESSIONS</span><span>FULL PRODUCT WALKTHROUGH</span></div><div class=\"product-rail\"><span>Ask</span><span>Assemble</span><span>Run</span><span>Review</span></div></div>\n </div>\n <p class=\"summary\">One workspace for the question, the expertise, the execution and the evidence.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science is the working environment around the model: the project, tools, execution and research record.</p><p>It connects different AI models, scientific skills and real research workflows. Researchers can choose models, agents, compute and data connections, then inspect both source materials and execution outputs inside the same project.</p><p>The animation shows running work, project spaces and recent sessions on the Open-Science home screen. Product scope follows the supplied v0.20.0 feature list.</p><div class=\"sources\">[Sources]<br>Open-Science feature list, stable v0.20.0; Open-Science home animation supplied by AIPOCH; product definition supplied by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-dark commons\" data-page=\"05\" data-title=\"One workbench. A shared space for open research.\">\n <div class=\"kicker\">04 / THE OPEN RESEARCH COMMONS</div>\n <h2 class=\"section-title\">One workbench.<br>A <span class=\"highlight-text\">shared space for open research</span></h2>\n <div class=\"content\">\n  <div><p class=\"community-intro\">Open-Science gives researchers across disciplines<br>a common place to work.</p><div class=\"commons-share\"><h3>What the community shares goes beyond code.</h3><p>Methods · Capability packages · Workflows<br>Validation records · Research practice</p></div><a class=\"github-metric\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><span class=\"value\">3.1K</span><span class=\"metric-label\">GITHUB STARS<br>aipoch/open-science</span></a><p class=\"fine\" style=\"margin-top:13px\">GitHub interest · Snapshot 2026.08</p></div>\n  <div class=\"commons-map\" data-community data-focus=\"\" aria-label=\"Four groups collaborating in the Open-Science shared research space\">\n   <div class=\"commons-space-head\">ONE SHARED RESEARCH SPACE</div>\n   <figure class=\"commons-art\"><div class=\"commons-art-stage\"><img class=\"commons-art-base\" src=\"/open-science/assets/779f062f1c72ba11.png\" alt=\"A circular shared research workspace with four groups: a researcher analyzing data, domain experts discussing methods, a developer orchestrating a workflow, and an institutional research team working with laboratory equipment.\"></div></figure>\n   <div class=\"commons-roles\" role=\"group\" aria-label=\"Explore how four community roles contribute\">\n    <button class=\"shared-role\" data-role=\"researcher\" aria-pressed=\"false\" aria-label=\"Researcher contribution path\">Researchers</button>\n    <button class=\"shared-role\" data-role=\"expert\" aria-pressed=\"false\" aria-label=\"Domain expert contribution path\">Domain experts</button>\n    <button class=\"shared-role\" data-role=\"developer\" aria-pressed=\"false\" aria-label=\"Developer contribution path\">Developers</button>\n    <button class=\"shared-role\" data-role=\"institution\" aria-pressed=\"false\" aria-label=\"Research institution contribution path\">Institutions</button>\n   </div>\n   <p class=\"commons-context\" id=\"commonsContext\" aria-live=\"polite\">Choose a role to see how each group contributes.</p>\n  </div>\n </div>\n <p class=\"summary commons-cycle\"><span class=\"cycle-label\">CONTRIBUTION LOOP</span><span>Use</span><span class=\"cycle-arrow\">↔</span><span>Ask</span><span class=\"cycle-arrow\">↔</span><span>Review</span><span class=\"cycle-arrow\">↔</span><span>Share</span><span class=\"cycle-arrow\">↔</span><span>Improve</span></p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science is the common ground for a global, open research community.</p><p>Researchers can use capabilities contributed by others and bring back real research questions. Domain experts can turn methods, rules and experience into Specialists or Skills. Developers can connect tools, data sources and workflow components. Laboratories and research institutions can take part in validation, reproduction and collaborative studies.</p><p>The community can share code, methods, capability packages, workflows, validation records and research practice. Contributors remain in control of what they make public.</p><p>The contribution loop is: use capabilities, surface questions, inspect methods, share experience and improve together. Selecting a role highlights the corresponding group in the circular workspace.</p><p>The illustration is conceptual. It does not depict an actual office, partner organization or live collaboration interface. The approximate 3.1K stars shown in the source screenshot indicate project interest—not users, contributors or a global ranking.</p><div class=\"sources\">[Sources]<br>Community roles, shared resources and contribution loop specified by AIPOCH. Concept illustration edited from the shared research-workspace artwork. GitHub interest figure: screenshot supplied on 2026-08-26.<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science GitHub repository</a></div></aside>\n</section>\n\n<section class=\"slide slide-surface capabilities\" data-page=\"06\" data-title=\"One research question. Six connected systems.\" data-research-journey>\n <div class=\"kicker\">05 / A RESEARCHER’S JOURNEY</div>\n <h2 class=\"section-title\">One research question.<br><span class=\"highlight-text\">Six connected systems.</span></h2>\n <p class=\"subtitle\">Follow a paper-reproduction task from project setup to a result you can inspect.</p>\n <div class=\"content\">\n  <div class=\"journey-task\"><span class=\"task-label\">EXAMPLE TASK</span><p>I have the paper and the data. I want to reproduce the main result.</p><span class=\"journey-hint\">Choose a step to follow the workflow →</span></div>\n  <div class=\"journey-steps\" role=\"tablist\" aria-label=\"Six product systems across a researcher journey\">\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-1\" aria-selected=\"true\" aria-controls=\"journey-panel-1\" aria-label=\"Step 1: Set up the project\" tabindex=\"0\" data-journey-step=\"0\"><span class=\"journey-dot\">01</span><span class=\"journey-action\">Set up the project</span><span class=\"journey-capability\">Persistent context</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-2\" aria-selected=\"false\" aria-controls=\"journey-panel-2\" aria-label=\"Step 2: Load specialist capabilities\" tabindex=\"-1\" data-journey-step=\"1\"><span class=\"journey-dot\">02</span><span class=\"journey-action\">Load expertise</span><span class=\"journey-capability\">Specialists & Skills</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-3\" aria-selected=\"false\" aria-controls=\"journey-panel-3\" aria-label=\"Step 3: Choose models and runtime\" tabindex=\"-1\" data-journey-step=\"2\"><span class=\"journey-dot\">03</span><span class=\"journey-action\">Choose your stack</span><span class=\"journey-capability\">Models · compute · runtime</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-4\" aria-selected=\"false\" aria-controls=\"journey-panel-4\" aria-label=\"Step 4: Approve the plan\" tabindex=\"-1\" data-journey-step=\"3\"><span class=\"journey-dot\">04</span><span class=\"journey-action\">Approve the plan</span><span class=\"journey-capability\">Orchestration &amp; permissions</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-5\" aria-selected=\"false\" aria-controls=\"journey-panel-5\" aria-label=\"Step 5: Inspect research outputs\" tabindex=\"-1\" data-journey-step=\"4\"><span class=\"journey-dot\">05</span><span class=\"journey-action\">Inspect outputs</span><span class=\"journey-capability\">Data & artifacts</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-6\" aria-selected=\"false\" aria-controls=\"journey-panel-6\" aria-label=\"Step 6: Review and reproduce\" tabindex=\"-1\" data-journey-step=\"5\"><span class=\"journey-dot\">06</span><span class=\"journey-action\">Review &amp; reproduce</span><span class=\"journey-capability\">Reviewer &amp; provenance</span></button>\n  </div>\n  <div class=\"journey-stage\">\n   <div class=\"journey-panel\" id=\"journey-panel-1\" role=\"tabpanel\" aria-labelledby=\"journey-tab-1\" data-journey-panel=\"0\">\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 01 / 06</p><h3 class=\"journey-detail-title\">Define the target before you begin.</h3><p class=\"journey-detail-copy\">Create a project, specify the result to reproduce, and add the paper and data. Every session that follows can use the same context.</p><p class=\"journey-result\"><span>OUTPUT</span>A project anchored in the question and source material</p><button class=\"journey-next\" data-journey-to=\"1\">Next: load specialist capabilities →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.512437810945274\"><figure class=\"crop shot\" data-crop=\"project|444,338,505,201\" style=\"aspect-ratio:505/201\"><img src=\"/open-science/assets/d13cf784f5a9e6bd.png\" alt=\"Open-Science project creation interface\" style=\"width:275.6435643564356%;left:-87.92079207920793%;top:-168.1592039800995%;height:auto\"></figure></div><figcaption>Create a project · Set the goal and context · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-2\" role=\"tabpanel\" aria-labelledby=\"journey-tab-2\" data-journey-panel=\"1\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 02 / 06</p><h3 class=\"journey-detail-title\">Bring the right expertise into the project.</h3><p class=\"journey-detail-copy\">Select a Specialist, load the Skills the task needs, and connect the right tools and data sources.</p><p class=\"journey-result\"><span>OUTPUT</span>A study-specific set of scientific capabilities</p><button class=\"journey-next\" data-journey-to=\"2\">Next: choose the model and runtime →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0668380462724936\"><figure class=\"crop shot\" data-crop=\"skills|599,386,804,389\" style=\"aspect-ratio:804/389\"><img src=\"/open-science/assets/860ec00c1fb345e1.png\" alt=\"Open-Science Skills interface for finding, adding and enabling capabilities\" style=\"width:222.63681592039802%;left:-74.50248756218906%;top:-99.22879177377892%;height:auto\"></figure></div><figcaption>Skills · Find and load on demand · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-3\" role=\"tabpanel\" aria-labelledby=\"journey-tab-3\" data-journey-panel=\"2\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 03 / 06</p><h3 class=\"journey-detail-title\">Choose how and where the work runs.</h3><p class=\"journey-detail-copy\">Select a model and an agent, configure a Python or R environment, and connect to remote compute when needed.</p><p class=\"journey-result\"><span>OUTPUT</span>A stack matched to the study</p><button class=\"journey-next\" data-journey-to=\"3\">Next: approve the plan →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.858974358974359\"><figure class=\"crop shot\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/675ebce5135a9a32.jpg\" alt=\"Open-Science model settings with provider and connection choices\" style=\"width:176.55172413793105%;left:-51.724137931034484%;top:-38.46153846153847%;height:auto\"></figure></div><figcaption>Model · Choose what the research uses · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-4\" role=\"tabpanel\" aria-labelledby=\"journey-tab-4\" data-journey-panel=\"3\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 04 / 06</p><h3 class=\"journey-detail-title\">Approve the plan before anything runs.</h3><p class=\"journey-detail-copy\">Review the plan and permissions. The main agent can then delegate work to sub-agents, call tools and run code while progress stays visible.</p><p class=\"journey-result\"><span>OUTPUT</span>Code, intermediate results and a complete run record</p><button class=\"journey-next\" data-journey-to=\"4\">Next: inspect research outputs →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5078534031413613\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,1146\" style=\"aspect-ratio:1728/1146\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science Session Plan with clarification, phased tasks and approval controls\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>Session Plan · Review before execution · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-5\" role=\"tabpanel\" aria-labelledby=\"journey-tab-5\" data-journey-panel=\"4\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 05 / 06</p><h3 class=\"journey-detail-title\">Inspect each output as soon as it lands.</h3><p class=\"journey-detail-copy\">Open figures, tables and notebooks inside the project. Compare them with source material in split view, then download or export.</p><p class=\"journey-result\"><span>OUTPUT</span>Research artifacts ready to inspect and share</p><button class=\"journey-next\" data-journey-to=\"5\">Next: review and reproduce →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.2113821138211383\"><figure class=\"crop shot\" data-crop=\"montage|350,100,1360,615\" style=\"aspect-ratio:1360/615\"><img src=\"/open-science/assets/cc5207fdea9c6cb8.png\" alt=\"Open-Science split view of generated files and reproduced figures\" style=\"width:131.61764705882354%;left:-25.735294117647058%;top:-16.260162601626014%;height:auto\"></figure></div><figcaption>Artifacts · Compare data and figures · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-6\" role=\"tabpanel\" aria-labelledby=\"journey-tab-6\" data-journey-panel=\"5\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 06 / 06</p><h3 class=\"journey-detail-title\">When the result differs, trace it back.</h3><p class=\"journey-detail-copy\">Compare it with the paper, inspect code, parameters and provenance, then revise the plan and rerun only what needs to change.</p><p class=\"journey-result\"><span>OUTPUT</span>A documented account of matches and discrepancies</p><button class=\"journey-next\" data-journey-to=\"3\">↶ Revise the plan and continue</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5391304347826087\"><figure class=\"crop shot\" data-crop=\"journeyReview|0,0,2124,1380\" style=\"aspect-ratio:2124/1380\"><img src=\"/open-science/assets/170cc0be788eeb29.jpg\" alt=\"Open-Science Session Reviewer showing consistency checks and review records\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>Reviewer · Inspect results and review records · Click to enlarge</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Context, files and provenance stay with the project, so a discrepancy leads back to the step that produced it.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The paper-reproduction example turns six product systems into a researcher’s journey.</p><p>The researcher creates a project with the paper and data, loads the required Specialist and Skills, then chooses the model, agent and runtime. After reviewing the plan, the system executes with real tools, produces files and supports comparison with the original paper.</p><p>The six steps are a teaching model, not a mandatory workflow. Project context, file management, permissions and provenance span the full journey. Researchers can return to earlier steps at any time. The final button returns to the planning stage; it does not claim that a background run has already restarted.</p><p>The task is illustrative, not a customer quote or performance claim. Screenshots come from different product demonstrations and are not presented as one continuous research run. A PASS in the Reviewer interface is not independent validation of every scientific conclusion.</p><p>Feature scope is based on the supplied stable v0.20.0 feature library. Support across Desktop, Web, Mobile and CLI/Headless varies by environment. MedFlow remains identified as roadmap work on the architecture slide and is not blended into the current execution capabilities shown here.</p><div class=\"sources\">[Sources]<br>Open-Science feature list, stable v0.20.0 (2026-08-25). Research journey assembled from AIPOCH product materials.<br>Product screenshots: new project, Skills settings, analysis montage, model settings, Session Plan and Session Reviewer.</div></aside>\n</section>\n\n<section class=\"slide workspace\" data-page=\"07\" data-title=\"Research shouldn't start over when a conversation ends.\">\n <div class=\"kicker\">06 / RESEARCH WORKSPACE</div>\n <h2 class=\"section-title\">Research shouldn't start over when <span class=\"highlight-text\">a conversation ends</span></h2>\n <p class=\"subtitle\">Projects carry context, materials and decisions forward as the work evolves.</p>\n <div class=\"content workspace-gallery gallery\">\n  <div class=\"workspace-tabs\" role=\"tablist\" aria-label=\"Persistent research workspace features\">\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"workspace-project\"><span class=\"num\">01</span><span><b>Persistent projects and sessions</b><small>Keep conversations, files and outputs together.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-context\"><span class=\"num\">02</span><span><b>Shared project context</b><small>Carry goals, definitions and constraints into each new session.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-branch\"><span class=\"num\">03</span><span><b>Branch when the question changes</b><small>Explore a new path without losing the work behind it.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-reference\"><span class=\"num\">04</span><span><b>Find and cite earlier sessions</b><small>Use # to bring previous work into the current conversation.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-sidechat\"><span class=\"num\">05</span><span><b>Guide a live run</b><small>Add instructions or feedback through Side chat.</small></span></button>\n  </div>\n  <div class=\"workspace-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"workspace-project\" style=\"--workspace-shot-ratio:1.7777777777777777\"><figure class=\"crop\" data-crop=\"workspaceProject|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/b222df7f22573047.jpg\" alt=\"Open-Science project workspace with multiple sessions, files and outputs\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project workspace · Build research across sessions</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-context\" style=\"--workspace-shot-ratio:.7689822294022617\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceContext|0,0,476,619\" style=\"aspect-ratio:476/619\"><img src=\"/open-science/assets/bd4267932c391f0f.jpg\" alt=\"Open-Science Project Settings with Agent Context\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project Agent Context · Carry shared goals into every session</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-branch\" style=\"--workspace-shot-ratio:1.8333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceBranch|600,800,1100,600\" style=\"aspect-ratio:1100/600\"><img src=\"/open-science/assets/4bb8c2a8d10c2112.jpg\" alt=\"Open-Science action for branching research into a new session\" style=\"width:181.72727272727275%;left:-54.54545454545454%;top:-133.33333333333331%;height:auto\"></figure><figcaption>Branch in new session · Explore another path from existing work</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-reference\" style=\"--workspace-shot-ratio:1.822\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceReference|0,0,911,500\" style=\"aspect-ratio:911/500\"><img src=\"/open-science/assets/beec2fa88029cfb7.jpg\" alt=\"Open-Science session search and reference menu\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption># Session reference · Find and continue earlier research</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-sidechat\" style=\"--workspace-shot-ratio:1.2857142857142858\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceSidechat|620,685,900,700\" style=\"aspect-ratio:900/700\"><img src=\"/open-science/assets/34b8bac0510d9049.png\" alt=\"Open-Science Side chat during a research run\" style=\"width:191.66666666666669%;left:-68.88888888888889%;top:-97.85714285714285%;height:auto\"></figure><figcaption>Side chat · Add guidance while the research is running</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Start a new session without starting the research over.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Research context belongs to the project, not to a single conversation.</p><p>Five product views demonstrate persistence: projects retain sessions and outputs; Project Agent Context carries shared goals and constraints; researchers can branch from existing work; # finds and references earlier sessions; Side chat adds guidance during a run.</p><p>Cross-session references use #, distinct from @ file references. “Continue the work” means restoring persistent records and context; it does not promise that every interrupted external compute job resumes automatically. The screenshots come from different demonstrations and are not presented as one continuous project recording.</p><div class=\"sources\">[Sources]<br>Open-Science feature list v0.20.0, including Project Agent Context, Session References, Branch and Live Side-Chat Advice. Product screenshots supplied on 2026-08-26.</div></aside>\n</section>\n\n<section class=\"slide slide-surface freedom\" data-page=\"08\" data-title=\"Build the stack around the research\">\n <div class=\"kicker\">07 / YOUR RESEARCH, YOUR STACK</div>\n <h2 class=\"section-title\">Build the stack <span class=\"highlight-text\">around the research</span></h2>\n <p class=\"subtitle\">Choose the right tools for each task—and switch them as the work evolves.</p>\n <div class=\"content split\"><div class=\"freedom-list\">\n <div class=\"feature-line\"><span class=\"num\">01</span><div><h3>Pick the agent</h3><p>Work with Claude Code, OpenCode, Codex or another execution framework.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">02</span><div><h3>Choose the model</h3><p>Connect multiple providers and gateways; switch by task.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">03</span><div><h3>Bring your own compute</h3><p>Run locally or connect a remote SSH host.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">04</span><div><h3>Set the runtime</h3><p>Use persistent Python, R and REPL environments.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">05</span><div><h3>Connect your data</h3><p>Work with project files, research Connectors and custom MCP servers.</p></div></div>\n </div><div class=\"gallery\" data-gallery=\"stack\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Technology choices\"><button role=\"tab\" aria-selected=\"true\" data-select=\"model\">Model</button><button role=\"tab\" aria-selected=\"false\" data-select=\"agent\">Agent</button><button role=\"tab\" aria-selected=\"false\" data-select=\"runtime\">Runtime</button><button role=\"tab\" aria-selected=\"false\" data-select=\"compute\">Compute</button><button role=\"tab\" aria-selected=\"false\" data-select=\"data\">Data</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"model\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/675ebce5135a9a32.jpg\" alt=\"Model provider choices including OpenAI, Anthropic, Grok, DeepSeek, GLM and Kimi\" style=\"width:176.55172413793105%;left:-51.724137931034484%;top:-38.46153846153847%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"agent\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"agent|765,530,1450,785\" style=\"aspect-ratio:1450/785\"><img src=\"/open-science/assets/9a16f4002be03931.jpg\" alt=\"Agent framework choices including Claude Agent, OpenCode and Codex\" style=\"width:176.55172413793105%;left:-52.758620689655174%;top:-67.51592356687898%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"runtime\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"runtime|205,300,964,543\" style=\"aspect-ratio:964/543\"><img src=\"/open-science/assets/01d69d0de306625a.jpg\" alt=\"Python and R notebook runtime settings\" style=\"width:142.32365145228215%;left:-21.265560165975103%;top:-55.24861878453039%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"compute\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"compute|205,155,964,688\" style=\"aspect-ratio:964/688\"><img src=\"/open-science/assets/48d4c8976e22f68d.jpg\" alt=\"Remote SSH compute host settings\" style=\"width:142.32365145228215%;left:-21.265560165975103%;top:-22.52906976744186%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"data\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"connectors|0,0,968,445\" style=\"aspect-ratio:968/445\"><img src=\"/open-science/assets/aad490288fa24051.jpg\" alt=\"Open-Science Connectors for research data services, local commands, remote MCP services and imported configurations\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div>\n </div><div class=\"shot-caption\"><span>BUILD YOUR STACK</span><span>SELECT A TAB TO VIEW THE PRODUCT</span></div><p class=\"small-note\">If you use third-party models, remote services or connectors, their data policies and pricing apply.</p></div></div>\n <p class=\"summary\">The stack can change. The research goal and every major choice stay with the researcher.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Model-agnostic does not mean model-free, and it does not make every third-party service free.</p><p>The five areas of choice are agents, models, compute, runtime and data. The supplied feature library confirms multiple providers, custom gateways, subscription sign-in, model switching, Python/R/REPL kernels, environment management, SSH compute, research connectors and custom MCP services.</p><p>The Data tab shows the Connectors page. Researchers can browse available connectors or add one through a local command, remote MCP service or imported configuration. Specific connectors shown are interface examples.</p><p>When cloud models, remote endpoints or third-party connectors are used, requests may be sent to those services. Local-first does not mean data remains on-device under every configuration. Availability varies by framework, service and execution environment.</p><div class=\"sources\">[Sources]<br>Open-Science feature list v0.20.0; product screenshots for Model, Agent, Runtime, Compute and Connectors.</div></aside>\n</section>\n\n<section class=\"slide ecosystem\" data-page=\"09\" data-title=\"Load the expertise your research needs\">\n <div class=\"kicker\">08 / SPECIALISTS & SKILLS</div>\n <h2 class=\"section-title\">Load the expertise <span class=\"highlight-text\">your research needs</span></h2>\n <p class=\"subtitle\">Specialists provide domain context. Skills package methods that can be called, combined and shared.</p>\n <div class=\"content\"><div class=\"gallery\" data-gallery=\"capabilities\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Specialists and Skills product views\"><button role=\"tab\" aria-selected=\"false\" data-select=\"specialists\">Specialists</button><button role=\"tab\" aria-selected=\"true\" data-select=\"skills\">Skills</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel\" data-panel=\"specialists\" role=\"tabpanel\"><figure class=\"crop specialist-shot\" data-crop=\"specialists|160,300,960,530\" style=\"aspect-ratio:960/530\"><img src=\"/open-science/assets/491a3968cb94db41.png\" alt=\"Specialist Marketplace with aerodynamics, astronomical photometry and atmospheric chemistry packages\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-56.60377358490566%;height:auto\"></figure></div>\n <div class=\"gallery-panel active\" data-panel=\"skills\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"skillsLatest|160,150,960,560\" style=\"aspect-ratio:960/560\"><img src=\"/open-science/assets/a5240cb3645ee9d5.png\" alt=\"Open-Science Skills interface for browsing, enabling, uploading, importing and creating Skills\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-26.785714285714285%;height:auto\"></figure></div></div><div class=\"skill-points\"><p><span>01</span><span class=\"skill-copy\"><b>Across disciplines:</b> Specialists and Skills span life science, medicine, chemistry, physics, astronomy, environmental science, engineering and data science.</span></p><p><span>02</span><span class=\"skill-copy\"><b>Yours to load, adapt and publish:</b> create a Skill in natural language, upload a package, import from GitHub or publish your own to the Marketplace.</span></p></div></div>\n <div><div class=\"sources-head\"><span class=\"label\">OPEN SKILL MARKETPLACE · USE, BUILD, CONTRIBUTE</span></div>\n <a class=\"source-row\" href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/cd170c5207db62ba.png\" alt=\"K-Dense mark\"><div class=\"source-copy\"><div class=\"source-name\">K-Dense <span class=\"source-stats\">34.8K ★ ↗</span></div><p class=\"source-desc\">Scientific Agent Skills · Research and analysis across disciplines</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/4124b8d03b154d23.png\" alt=\"Anthropic mark\"><div class=\"source-copy\"><div class=\"source-name\">Claude Skills <span class=\"source-stats\">171.9K ★ ↗</span></div><p class=\"source-desc\">Anthropic Agent Skills · Document, design and developer workflows</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/5d9fa88bda04c547.png\" alt=\"Google DeepMind mark\"><div class=\"source-copy\"><div class=\"source-name\">Google DeepMind <span class=\"source-stats\">2.8K ★ ↗</span></div><p class=\"source-desc\">Science Skills · Genomics, structural biology and scientific search</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo nature-logo\" src=\"/open-science/assets/3b16f5fd9a4fca0f.png\" alt=\"Nature Skills project mark\"><div class=\"source-copy\"><div class=\"source-name\">Nature Skills <span class=\"source-stats\">37.3K ★ ↗</span></div><p class=\"source-desc\">Scientific discovery, writing, visualization and peer review</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/9cc9bee9a501b541.png\" alt=\"NVIDIA mark\"><div class=\"source-copy\"><div class=\"source-name\">NVIDIA BioNeMo <span class=\"source-stats\">434 ★ ↗</span></div><p class=\"source-desc\">BioNeMo Agent Toolkit · Protein, molecule and genomics workflows</p></div></a>\n <div class=\"marketplace-contribute\"><span class=\"contribute-mark\">＋</span><div><b>PUBLISH YOUR SKILL</b><p>Share it through the Marketplace so others can inspect, load, test and improve it.</p></div></div>\n </div>\n </div>\n <p class=\"summary\">Find what you need, adapt it to the study, and return what you learn to the community.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Researchers can be both users and contributors of open scientific capability.</p><p>A Specialist is a capability package for a defined professional scope and may include dedicated Skills and Connectors. A Skill is a scientific capability that can be called and combined independently. Open-Science supports enabling Skills on demand, uploading packages, importing from GitHub or installed directories, and creating a personal Skill through conversation or an editor.</p><p>Skills created or maintained by users can be published to the Marketplace, where other researchers can load, validate, reuse, discuss and improve them. The result is an open loop of use, creation, publication, reuse and improvement.</p><p>The eight-plus domains summarize representative Specialists and open Skill collections; they are not a fixed taxonomy. GitHub star figures are a snapshot from 2026-08-27.</p><div class=\"sources\">[Sources]<br>Open-Science Skills screenshot, Specialist Marketplace screenshot and feature list supplied by AIPOCH; Marketplace publishing behavior confirmed on 2026-08-27.<br><a href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\">K-Dense Scientific Agent Skills</a><br><a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">Anthropic Skills</a><br><a href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\">Google DeepMind Science Skills</a><br><a href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\">Nature Skills</a><br><a href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\">NVIDIA BioNeMo Agent Toolkit</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark execution\" data-page=\"10\" data-title=\"Put scientific capabilities to work\">\n <div class=\"kicker\">09 / SCIENTIFIC EXECUTION</div>\n <h2 class=\"section-title\">Put scientific capabilities <span class=\"highlight-text\">to work</span></h2>\n <p class=\"subtitle\">You set the task; the agent proposes a plan, and once you approve it, sub-agents split the work while a Reviewer Specialist checks the result.</p>\n <div class=\"execution-interactive gallery\" data-gallery=\"execution\">\n  <div class=\"execution-tabs\" role=\"tablist\" aria-label=\"Four stages of real research execution\">\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"execution-plan\"><span class=\"execution-num\">01</span><span><b>Define the task</b><small>Agent proposes · Researcher approves</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-delegate\"><span class=\"execution-num\">02</span><span><b>Delegate the work</b><small>Main agent → Sub-agents</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-run\"><span class=\"execution-num\">03</span><span><b>Run with real tools</b><small>Skill · Connector · Compute</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-review\"><span class=\"execution-num\">04</span><span><b>Review the result</b><small>Method · Evidence · Claim · Record</small></span></button>\n  </div>\n  <div class=\"execution-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"execution-plan\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / TASK → PLAN → APPROVAL</strong><span>The researcher approves the direction before execution</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,900\" style=\"aspect-ratio:1728/900\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science creates a structured Session Plan from the research task and waits for approval\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>A STRUCTURED PLAN BEFORE EXECUTION</span><span>Goals · Steps · Boundaries · Deliverables</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-delegate\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / COMPLEX WORK → SPECIALIST TASKS</strong><span>The main agent assigns and tracks each branch</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"subagents|75,250,900,340\" style=\"aspect-ratio:900/340\"><img src=\"/open-science/assets/6dac6a590e97efcb.png\" alt=\"Open-Science delegates work to five sub-agents and displays their status\" style=\"width:115.44444444444444%;left:-8.333333333333332%;top:-73.52941176470588%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>DELEGATED TO 5 SUB-AGENTS</span><span>Task · Specialist role · Status</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-run\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / EXECUTE IN REAL ENVIRONMENTS</strong><span>Tool calls and run status remain visible</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"live|0,0,2400,1400\" style=\"aspect-ratio:2400/1400\"><img src=\"/open-science/assets/afcbc08c4390f82c.webp\" alt=\"Open-Science agent calling real tools and producing research outputs\" style=\"width:160%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SKILL · CONNECTOR · PYTHON / R · REMOTE COMPUTE</span><span>Run · Status · Artifacts</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-review\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / REVIEWER SPECIALIST</strong><span>Checks the record; expert judgment still decides</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"journeyReview|0,0,2124,1100\" style=\"aspect-ratio:2124/1100\"><img src=\"/open-science/assets/170cc0be788eeb29.jpg\" alt=\"Open-Science Session Reviewer checking consistency across the plan, execution record and artifacts\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PLAN · EXECUTION · ARTIFACT · CLAIM</span><span>Method · Evidence · Conclusion · Record</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">You steer the research; the main agent coordinates the work, sub-agents execute it, and the Reviewer Specialist checks the record.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The researcher defines the task, the main agent drafts the plan, sub-agents execute in parallel and a Reviewer Specialist checks the result.</p><p>This slide is an interactive four-stage product walkthrough: Plan, Delegation, Execution and Review. The agent first turns the task and project context into a structured plan with goals, steps, boundaries and deliverables. The main agent begins decomposition and coordination only after the researcher has reviewed and approved the plan.</p><p>Sub-agents can handle clarification, literature collection, evidence mapping, gap analysis and route selection, calling Skills, Connectors, Python/R and local or remote compute. Their tasks, roles and status remain visible. Once artifacts are produced, the Reviewer Specialist checks methods, evidence, claims and execution records. It is a review mechanism—not a guarantee that the scientific conclusion is correct.</p><p>The four views are real product interfaces from different demonstrations; they are not presented as one continuous run.</p><div class=\"sources\">[Sources]<br>Open-Science feature list covering Plans, Sub-agents, Reviewer, Skills, Connectors, runtimes and artifacts; product logic confirmed on 2026-08-27. Session Plan, five Sub-agents and Session Reviewer screenshots supplied by AIPOCH.<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science product page</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark evidence\" data-page=\"11\" data-title=\"Keep every file together. Trace every result back.\">\n <div class=\"kicker\">10 / DATA, ARTIFACTS & TRUST</div>\n <h2 class=\"section-title\">Keep every file together.<br><span class=\"highlight-text\">Trace every result back.</span></h2>\n <p class=\"subtitle\">Source material, execution records and final artifacts stay linked inside the project.</p>\n <div class=\"evidence-interactive gallery\" data-gallery=\"evidence\">\n  <div class=\"evidence-tabs\" role=\"tablist\" aria-label=\"Four ways Open-Science manages materials, outputs and trust\">\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"evidence-materials\"><span class=\"evidence-num\">01</span><span><b>MATERIALS</b><small>Manage project files, attachments up to 10 GB, and @ / # references.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-artifacts\"><span class=\"evidence-num\">02</span><span><b>ARTIFACTS</b><small>Preview and export datasets, notebooks, figures and reports.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-provenance\"><span class=\"evidence-num\">03</span><span><b>PROVENANCE</b><small>Trace an artifact back to code, tool calls and run output.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-control\"><span class=\"evidence-num\">04</span><span><b>CONTROL</b><small>Set permissions, approvals and Auto-review for each session.</small></span></button>\n  </div>\n  <div class=\"evidence-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"evidence-materials\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / MATERIALS</strong><span>Add, organize and reference source material</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"evidenceMaterials|0,500,2113,820\" style=\"aspect-ratio:2113/820\"><img src=\"/open-science/assets/840a5021386b1c69.jpg\" alt=\"Open-Science Files with uploaded materials, generated files and in-session file references\" style=\"width:100%;left:0%;top:-60.97560975609756%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PROJECT FILES · UPLOADS · GENERATED FILES</span><span>@ FILES · # SESSIONS</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-artifacts\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / ARTIFACTS</strong><span>Review and deliver outputs without leaving the project</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"montage|340,90,1390,550\" style=\"aspect-ratio:1390/550\"><img src=\"/open-science/assets/cc5207fdea9c6cb8.png\" alt=\"Open-Science split view of a research session, generated files and scientific figures\" style=\"width:128.77697841726618%;left:-24.46043165467626%;top:-16.363636363636363%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>DATA · NOTEBOOK · FIGURE · REPORT</span><span>Preview · Split view · Download · Export</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-provenance\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / PROVENANCE</strong><span>Trace an artifact back to the work that produced it</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"evidenceProvenance|0,0,1036,420\" style=\"aspect-ratio:1036/420\"><img src=\"/open-science/assets/f9c447a7b173ed47.png\" alt=\"Open-Science Execution Log with notebook code, research tool calls, run input and output\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>CODE · EXECUTION LOG · ENVIRONMENT</span><span>The run record persists</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-control\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / CONTROL</strong><span>The researcher decides what the agent may do</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"evidenceControl|190,100,1150,448\" style=\"aspect-ratio:1150/448\"><img src=\"/open-science/assets/7d9800fd7fd1dcab.jpg\" alt=\"Open-Science Permission Mode with ask, auto-approve and full-access options plus Auto-review\" style=\"width:132.08695652173915%;left:-16.52173913043478%;top:-22.321428571428573%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>ASK · AUTO-APPROVE · FULL ACCESS</span><span>Session permissions · Auto-review</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Every result stays connected to the material, code, environment and decisions behind it.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Materials, artifacts, execution records and permissions remain linked inside the same project.</p><p>Select the four tabs to switch between real product views. Materials shows uploads, generated files and @ references. Artifacts shows multi-format outputs and split-screen preview. Provenance shows code, tool calls and run output retained in the Execution Log. Control shows permission modes, session capabilities and Auto-review settings.</p><p>File support includes attachments up to 10 GB, a project library, @ file and path references, # cross-session references, and previews for data, notebooks, images, PDFs, Office files and chemical structures. Availability and limits vary by client, environment and file type. Full access should be chosen with care, especially for sensitive data and controlled environments.</p><p>Screenshots come from different product demonstrations and illustrate the interfaces only. Scientific content shown in them has not been independently validated as a research or clinical conclusion.</p><div class=\"sources\">[Sources]<br>Open-Science feature list v0.20.0; analysis montage; Files/Artifacts, Execution Log and Permission Mode screenshots supplied by AIPOCH on 2026-08-27.</div></aside>\n</section>\n\n<section class=\"slide architecture\" data-page=\"12\" data-title=\"AIPOCH is building the infrastructure for open research\">\n <div class=\"kicker\">11 / THE AIPOCH PRODUCT ARCHITECTURE</div>\n <h2 class=\"section-title\">AIPOCH is building the infrastructure <span class=\"highlight-text\">for open research</span></h2>\n <p class=\"subtitle\">Open-Science is the public workbench, supported by specialist capabilities, execution engines and technical services.</p>\n <div class=\"content\"><img class=\"architecture-image\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"AIPOCH product architecture represented as a building with services, capabilities, execution and an open research space\">\n <div class=\"architecture-layers\">\n <div class=\"architecture-layer\"><div class=\"en\">01 / OPEN RESEARCH SPACE</div><h3>Open-Science</h3><p>The open workbench and community entry point</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">02 / EXECUTION ENGINE</div><h3>MedFlow <span class=\"status planned\" style=\"margin-left:14px\">ROADMAP</span></h3><p>Planned to turn scientific capabilities into resumable research workflows</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">03 / SCIENTIFIC CAPABILITIES</div><h3>Specialists · Skills · Connectors</h3><p>MedSkillAudit evaluates Skills; benchmarks and rankings are planned</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">04 / TECHNICAL FOUNDATION</div><h3>Model · Agent · Compute</h3><p>Runtime, environment and data services</p></div>\n </div><span class=\"architecture-pin\" style=\"left:1135px;top:81px\">01</span><span class=\"architecture-pin\" style=\"left:1050px;top:199px\">02</span><span class=\"architecture-pin\" style=\"left:1090px;top:309px\">03</span><span class=\"architecture-pin\" style=\"left:1040px;top:439px\">04</span><div class=\"architecture-community\"><strong>GLOBAL OPEN RESEARCH COMMUNITY</strong>　Contribute · Review · Collaborate · Reuse</div></div>\n <p class=\"summary\">AIPOCH brings models, tools and scientific know-how into one stack, then opens that stack to the research community through Open-Science.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The architecture is shown from the AIPOCH company perspective: Open-Science is the open entry point, supported by execution, capability and technical layers.</p><p>The upper space is Open-Science, containing projects, sessions, context, files and research outputs. MedFlow is the specialist execution engine on the roadmap, intended to organize validated capabilities into executable, recoverable workflows. The capability layer contains Specialists, Skills and Connectors. MedSkillAudit audits and evaluates Skills, with benchmarks and capability rankings planned over time. The foundation provides models, agents, compute, environments and data services.</p><p>This is a conceptual product architecture, not a deployment topology. The space around the building represents the global open research community contributing, validating, collaborating and reusing capabilities.</p><p>MedFlow remains marked as roadmap work in line with public product status.</p><div class=\"sources\">[Sources]<br>AIPOCH 2026 mid-year architecture artwork; architecture framing confirmed by AIPOCH; Open-Science feature list; <a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH product status</a>.</div></aside>\n</section>\n\n<section class=\"slide slide-dark cobuild\" data-page=\"13\" data-title=\"A global community can take research further\">\n <div class=\"kicker\">12 / BUILT BY THE RESEARCH COMMUNITY</div>\n <h2 class=\"section-title\">A global community can take <span class=\"highlight-text\">research further</span></h2>\n <p class=\"subtitle\">Researchers, domain experts, developers and institutions contribute the methods and tools; AIPOCH supports the places and programs that bring them together.</p>\n <div class=\"content\"><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">RESEARCHERS</div><h3>Researchers</h3><p>Use community-built capabilities<br>and bring back real questions.</p></div><div class=\"role\"><div class=\"role-en\">DOMAIN EXPERTS</div><h3>Domain experts</h3><p>Package methods and judgment<br>as Specialists or Skills.</p></div></div><div class=\"community-core\"><div class=\"radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><div><strong>Open-Science</strong><span class=\"mini\">OPEN TO CONTRIBUTION</span></div></div><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">DEVELOPERS</div><h3>Developers</h3><p>Connect tools, data sources<br>and workflow components.</p></div><div class=\"role\"><div class=\"role-en\">RESEARCH INSTITUTIONS</div><h3>Institutions</h3><p>Run validation, reproduction<br>and collaborative studies.</p></div></div></div>\n <div class=\"community-support\"><div class=\"support-brand\"><img class=\"community-sticker\" src=\"/open-science/assets/fc401060a5053e19.png\" alt=\"Hi, AIPOCH pixel sticker for community support\"><div><span>AIPOCH / COMMUNITY CONVENER</span><b>Bringing people and infrastructure<br>together</b></div></div><div class=\"support-items\"><div class=\"support-item\"><small>01 / INFRASTRUCTURE</small><strong>Open infrastructure</strong></div><div class=\"support-item\"><small>02 / WORKSHOPS</small><strong>Online &amp; in-person workshops</strong></div><div class=\"support-item\"><small>03 / CO-RESEARCH</small><strong>Collaborative projects with research groups</strong></div><div class=\"support-item\"><small>04 / MARKETPLACE</small><strong>Skill &amp; Specialist<br>Marketplace</strong></div></div></div>\n <aside class=\"notes\"><p class=\"speaker-summary\">The community contributes scientific capability; AIPOCH provides infrastructure, programs and collaboration mechanisms that help co-creation continue.</p><p>The community has four roles: researchers, domain experts, developers and research institutions. Researchers use capabilities and return real problems. Domain experts codify Specialists and Skills. Developers connect tools, data sources and workflow components. Institutions support validation, reproduction and collaborative research.</p><p>AIPOCH is not a fifth community role. It convenes and supports the community through open infrastructure, online and in-person workshops, research-group collaborations, and the Skill & Specialist Marketplace. Contributors decide what to publish; private research data does not have to be made public. Research collaborations are agreed project by project.</p><div class=\"sources\">[Sources]<br>Global open research community positioning, four contribution roles and AIPOCH support model specified by AIPOCH. Pixel-sticker artwork supplied and adapted for this deck.</div></aside>\n</section>\n\n<section class=\"slide slide-surface flywheel\" data-page=\"14\" data-title=\"What one project learns can move the next one forward\">\n <div class=\"kicker\">13 / KNOWLEDGE THAT OTHERS CAN BUILD ON</div>\n <h2 class=\"section-title\">What one project learns can<br><span class=\"highlight-text\">move the next one forward</span></h2>\n <div class=\"content\"><div><p class=\"body-text\">Once methods and hard-won research practice are tested and shared, they do not have to disappear into a final report.</p><div class=\"participation\"><div><b>USE</b><span>Apply an existing capability</span></div><div><b>CONTRIBUTE</b><span>Share a method or component</span></div><div><b>VALIDATE</b><span>Review, reproduce, challenge</span></div><div><b>CO-CREATE</b><span>Work together on a real question</span></div></div><p class=\"fine\" style=\"margin-top:29px\">A model AIPOCH aims to build with the global research community.</p></div><div class=\"wheel\"><div class=\"wheel-track\"></div><div class=\"wheel-center\">Shared<br>capability<small>TESTED · REUSABLE</small></div><div class=\"wheel-node wn1\"><b>01</b><span>Research question</span><small>Start with a real need</small></div><div class=\"wheel-node wn2\"><b>02</b><span>Collaborate</span><small>Bring the right disciplines together</small></div><div class=\"wheel-node wn3\"><b>03</b><span>Package the method</span><small>Skill or Workflow</small></div><div class=\"wheel-node wn4\"><b>04</b><span>Test it</span><small>Methods, limits, results</small></div><div class=\"wheel-node wn5\"><b>05</b><span>Publish &amp; reuse</span><small>Keep source and version</small></div><div class=\"wheel-node wn6\"><b>06</b><span>Learn from use</span><small>New cases, better capability</small></div></div></div>\n <p class=\"summary\">Let the next researcher begin with everything the last project learned.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">When a method is tested, documented and shared, the next project can start with more than a blank page.</p><p>The community loop begins with a real question, moves through collaborative research, packaging, testing and publication, then improves through new use. Contributions can take the form of Specialists, Skills, Connectors or Workflows.</p><p>This slide describes the collaboration model AIPOCH aims to build. It does not imply that every review, publishing, governance or partnership workflow is already available as a product feature.</p><div class=\"sources\">[Sources]<br>Community vision and contribution loop confirmed by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-dark closing\" data-page=\"15\" data-title=\"Build Science in the Open\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"Open research infrastructure connected to a global community\">\n <div class=\"kicker\" style=\"color:#b4b4ae\">AIPOCH / OPEN-SCIENCE</div>\n <h2 class=\"closing-title\">Build Science<br>in the <span class=\"highlight-text en\">Open.</span></h2>\n <p class=\"closing-sub\">Put research expertise to work.<br>On your terms.</p>\n <div class=\"closing-label\">A GLOBAL<br>OPEN RESEARCH<br>COMMUNITY</div>\n <div class=\"closing-links\"><a class=\"closing-link\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><b>Explore Open-Science ↗</b><span>AIPOCH.COM/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><b>Build with us on GitHub ↗</b><span>GITHUB.COM/AIPOCH/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\"><b>Partner with AIPOCH ↗</b><span>AIPOCH.COM/CONTACT-US</span></a></div>\n <a class=\"qr-block\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><img src=\"/open-science/assets/fe24c474cce9b5ba.svg\" alt=\"QR code for the Open-Science product page\"><p>Explore Open-Science</p></a>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open research compounds: each reusable capability gives the next project a stronger starting point.</p><p>The close offers three next steps: explore Open-Science, build with the community on GitHub, or speak with AIPOCH about a research collaboration.</p><p>The QR code points to https://aipoch.com/open-science. Product content is presented for scientific research use; research outputs still require professional review.</p><div class=\"sources\">[Sources]<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science const frames={zh:document.getElementById('deck-zh'),en:document.getElementById('deck-en')};
const loading=document.getElementById('loading');
const validHash=hash=>/^#slide-\d{2}$/.test(hash||'')?hash:'#slide-01';
const params=new URLSearchParams(location.search);
let stored='';
try{stored=localStorage.getItem('aipoch-deck-language')||''}catch{}
let activeLang=['zh','en'].includes(params.get('lang'))?params.get('lang'):(['zh','en'].includes(stored)?stored:(navigator.language.toLowerCase().startsWith('zh')?'zh':'en'));
let currentHash=validHash(location.hash);
const ready={zh:false,en:false};

function childHash(lang){
  try{
    const active=frames[lang].contentDocument.querySelector('.slide.active');
    if(active&&/^\d{2}$/.test(active.dataset.page||''))return '#slide-'+active.dataset.page;
    return validHash(frames[lang].contentWindow.location.hash);
  }catch{return currentHash}
}

function syncParentHash(hash){
  currentHash=validHash(hash);
  const url=new URL(location.href);
  url.searchParams.set('lang',activeLang);
  url.hash=currentHash;
  if(location.href!==url.href)history.replaceState(null,'',url);
}

function controlMarkup(lang){
  return '<div class="os-language-switch" role="group" aria-label="Switch presentation language">'+
    '<button type="button" data-deck-language="zh" aria-label="切换到中文版">中文</button>'+
    '<button type="button" data-deck-language="en" aria-label="Switch to English">EN</button>'+
    '</div>';
}

function installControl(lang){
  const doc=frames[lang].contentDocument;
  if(!doc||doc.getElementById('os-bilingual-control'))return;
  const style=doc.createElement('style');
  style.id='os-bilingual-control';
  style.textContent='.os-language-switch{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:3px;border:1px solid rgba(255,255,255,.26);border-radius:999px;background:rgba(17,17,17,.78);box-shadow:0 5px 20px rgba(0,0,0,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:Arial,Helvetica,sans-serif}.os-language-switch button{min-width:48px;height:26px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.72);font:600 11px/26px Arial,Helvetica,sans-serif;letter-spacing:.04em;cursor:pointer}.os-language-switch button:hover{color:#fff}.os-language-switch button.is-active{background:#f5df5e;color:#111}.os-language-switch button:focus-visible{outline:2px solid #f5df5e;outline-offset:2px}@media(max-width:760px){.os-language-switch{top:10px}.os-language-switch button{min-width:43px;height:24px;line-height:24px;padding:0 9px}}';
  doc.head.appendChild(style);
  const holder=doc.createElement('div');
  holder.innerHTML=controlMarkup(lang);
  const control=holder.firstElementChild;
  doc.body.appendChild(control);
  control.querySelectorAll('button').forEach(button=>button.addEventListener('click',event=>{
    event.preventDefault();
    event.stopPropagation();
    void window.__switchDeckLanguage(button.dataset.deckLanguage);
  }));
  updateControls();
}

function updateControls(){
  Object.values(frames).forEach(frame=>{
    try{
      frame.contentDocument.querySelectorAll('[data-deck-language]').forEach(button=>{
        const selected=button.dataset.deckLanguage===activeLang;
        button.classList.toggle('is-active',selected);
        button.setAttribute('aria-pressed',String(selected));
      });
    }catch{}
  });
}

async function exitFullscreen(){
  try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}
  for(const frame of Object.values(frames)){
    try{if(frame.contentDocument.fullscreenElement)await frame.contentDocument.exitFullscreen()}catch{}
  }
}

async function setLanguage(lang,{exitFull=true}={}){
  if(!['zh','en'].includes(lang))return;
  const previous=activeLang;
  if(ready[previous])currentHash=childHash(previous);
  if(exitFull)await exitFullscreen();
  activeLang=lang;
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  frames.zh.hidden=lang!=='zh';
  frames.en.hidden=lang!=='en';
  if(ready[lang]){
    try{frames[lang].contentWindow.location.hash=currentHash}catch{}
    loading.hidden=true;
  }
  try{localStorage.setItem('aipoch-deck-language',lang)}catch{}
  syncParentHash(currentHash);
  updateControls();
}

window.__switchDeckLanguage=setLanguage;

Object.entries(frames).forEach(([lang,frame])=>{
  frame.addEventListener('load',()=>{
    ready[lang]=true;
    try{
      frame.contentWindow.location.hash=currentHash;
      frame.contentWindow.addEventListener('hashchange',()=>{
        if(lang===activeLang)syncParentHash(frame.contentWindow.location.hash);
      });
    }catch{}
    installControl(lang);
    try{
      const root=frame.contentDocument.querySelector('main')||frame.contentDocument.body;
      if(!root || root.nodeType !== 1 && root.nodeType !== 9)return;
      const observer=new frame.contentWindow.MutationObserver(()=>{
        if(lang===activeLang)syncParentHash(childHash(lang));
      });
      observer.observe(root,{subtree:true,attributes:true,attributeFilter:['class','aria-hidden']});
    }catch{}
    if(lang===activeLang){frame.hidden=false;loading.hidden=true}
  });
  frame.srcdoc=documents[lang];
});

window.addEventListener('hashchange',()=>{
  currentHash=validHash(location.hash);
  try{frames[activeLang].contentWindow.location.hash=currentHash}catch{}
});

void setLanguage(activeLang,{exitFull:false});
</script>

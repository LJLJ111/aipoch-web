rt\"><main id=\"deck\" aria-label=\"AIPOCH Open-Science 产品介绍\">\n<div class=\"progress-bar-nav\"><div id=\"progressFill\" class=\"progress-bar-fill\"></div></div>\n<nav class=\"nav-bar\" aria-label=\"品牌\"><a class=\"nav-logo\" href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\"><span class=\"brand-mark\"><img src=\"/open-science/assets/e3824afb44bd1b7c.png\" alt=\"\"></span>AIPOCH</a><div class=\"nav-context\">OPEN-SCIENCE · PRODUCT & COMMUNITY · 2026.08</div></nav>\n\n<section class=\"slide slide-dark cover active\" data-page=\"01\" data-title=\"AIPOCH · Open-Science\" aria-label=\"第1页 AIPOCH Open-Science\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div>\n <img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"开放科研基础设施的建筑线稿\">\n <div class=\"brand-lead\">AIPOCH <span style=\"font:12px var(--mono);letter-spacing:.17em;color:#aaa;vertical-align:middle;margin-left:22px\">AI4SCIENCE</span></div>\n <h1 class=\"hero-title\"><span class=\"highlight-text en\">Open-Science</span></h1>\n <p class=\"cover-sub\">开源、模型自由的科研工作台</p>\n <p class=\"manifesto\">让专业科研能力触手可及，<br>让选择权回到研究者手中。</p>\n <span class=\"radar-node decor\" style=\"left:1120px;top:252px\"></span><span class=\"radar-node decor\" style=\"left:1455px;top:482px\"></span><span class=\"radar-node decor\" style=\"left:1230px;top:706px\"></span>\n <div class=\"cover-meta\">OPEN TO RESEARCH. BUILT TOGETHER.</div>\n <p class=\"cover-label\">以 Open-Science 为核心<br>共建全球科研开源社区</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">AIPOCH 以 Open-Science 为核心，让全球研究者自由使用和共同建设专业科研能力。</p><p>开场先建立公司与产品关系：AIPOCH 是专注 AI4Science 的科技公司，Open-Science 是面向研究者的开源、模型自由科研工作台。本次介绍聚焦产品、科研能力和开放社区。</p><p>“模型自由”指选择模型、供应商与部署方式的自由，不代表无需模型，也不意味着第三方模型调用和算力免费。</p><div class=\"sources\">[Sources]<br>公司与产品定义：用户提供的对外介绍。建筑素材：AIPOCH 2026 年中汇报。视觉参考：AIPOCH — Skill Infrastructure for Medical Research。</div></aside>\n</section>\n\n<section class=\"slide\" data-page=\"02\" data-title=\"把科研经验变成可执行的科学能力\">\n <div class=\"kicker\">01 / ABOUT AIPOCH</div>\n <h2 class=\"section-title\">把科研经验，变成<span class=\"highlight-text\">可执行的科学能力</span></h2>\n <p class=\"mission-intro\">AIPOCH 是一家专注于 AI4Science 的科技公司。我们让 AI 的计算与推理能力，与人类专家长期积累的科研经验相互增强，将分散的知识、资源与工作流转化为可执行、可验证、可复用的科研能力。</p>\n <div class=\"mission-formula\">\n  <div class=\"formula-part\"><span class=\"label\">MACHINE INTELLIGENCE</span><div class=\"en-big\">AI Compute<br>& Reasoning</div><div class=\"cn\">计算 · 推理 · 执行</div></div><div class=\"formula-symbol\">×</div>\n  <div class=\"formula-part\"><span class=\"label\">HUMAN EXPERTISE</span><div class=\"en-big\">Human Research<br>Experience</div><div class=\"cn\">经验 · 方法 · 判断 · 专业边界</div></div><div class=\"formula-symbol\">→</div>\n  <div class=\"formula-part formula-result\"><span class=\"label\" style=\"color:#655b2b\">SCIENTIFIC CAPABILITY</span><div class=\"en-big\">知识可以执行，<br>经验可以复用。</div><div class=\"cn\">在真实研究中验证与改进</div></div>\n </div>\n <p class=\"summary\">让科研经验进入实际研究过程，加速科学发现。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">AIPOCH 的工作，是让专业经验成为研究者真正可以调用的能力。</p><p>AI 提供计算、推理、信息处理与执行能力；人类科研经验提供方法、领域知识、判断标准和适用边界。两者相互增强，才能让专业知识进入真实任务，接受检查，并在不同研究中复用。</p><p>Open-Science 是使用这些能力的工作台，也是未来社区共同完善这些能力的入口。</p><div class=\"sources\">[Sources]<br>用户提供的 AIPOCH 公司定义与年中汇报产品部分。</div></aside>\n</section>\n\n<section class=\"slide slide-surface\" data-page=\"03\" data-title=\"科研需要的不只是更强的模型\">\n <div class=\"kicker\">02 / THE RESEARCH GAP</div>\n <h2 class=\"section-title\">科研需要的，<br>不只是<span class=\"highlight-text\">更强的模型</span></h2>\n <p class=\"subtitle\">真实研究需要连接证据、方法、工具、计算环境与结果。</p>\n <div class=\"fragmented\">\n  <div class=\"fragment\"><div class=\"index\">01</div><h3>问题</h3><div class=\"en\">QUESTION</div><p class=\"gap-note\">研究目标<br>反复解释</p></div>\n  <div class=\"fragment\"><div class=\"index\">02</div><h3>证据</h3><div class=\"en\">EVIDENCE</div><p class=\"gap-note\">文献与数据<br>分散检索</p></div>\n  <div class=\"fragment\"><div class=\"index\">03</div><h3>方案</h3><div class=\"en\">METHOD</div><p class=\"gap-note\">专业方法<br>依赖经验</p></div>\n  <div class=\"fragment\"><div class=\"index\">04</div><h3>分析</h3><div class=\"en\">EXECUTION</div><p class=\"gap-note\">代码与环境<br>来回切换</p></div>\n  <div class=\"fragment\"><div class=\"index\">05</div><h3>验证</h3><div class=\"en\">VALIDATION</div><p class=\"gap-note\">过程与结果<br>难以对应</p></div>\n  <div class=\"fragment\"><div class=\"index\">06</div><h3>成果</h3><div class=\"en\">ARTIFACTS</div><p class=\"gap-note\">产物与记录<br>难以复用</p></div>\n </div>\n <p class=\"problem-foot\">当前的断点：<span style=\"color:#111\">上下文丢失、工具断裂、执行中断、来源不清</span></p>\n <p class=\"summary\">把割裂的工具连接起来，让研究可以连续进行。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">科研需要能够连续工作的研究环境，而不只是一次更好的回答。</p><p>这一页不是宣称所有 AI 对话工具都无法执行，而是说明科研仍需要完整的上下文、专业方法、计算资源和结果验证。信息搬运、环境配置、方法检查与成果整理，经常落在研究者自己身上。</p><div class=\"sources\">[Sources]<br>用户确认的叙事方案；原参考稿的 Fragmented Research Workflow 结构。</div></aside>\n</section>\n\n<section class=\"slide\" data-page=\"04\" data-title=\"从问题直接进入真实研究\">\n <div class=\"kicker\">03 / MEET OPEN-SCIENCE</div>\n <h2 class=\"section-title\">从问题，直接进入<span class=\"highlight-text\">真实研究</span></h2>\n <p class=\"subtitle\">连接 AI 模型、专业科研能力与真实研究流程。</p>\n <div class=\"content split wide-visual\">\n  <div class=\"overview-copy\"><p class=\"body-text\">Open-Science 是 AIPOCH 推出的开源、模型自由科研工作台。<br><br>自由选择工具，在透明、可控和可复现的环境中开展研究，并保留完整过程记录。</p><div class=\"key-values\"><div class=\"key-value\"><b>开放</b><span>OPEN SOURCE</span></div><div class=\"key-value\"><b>自主选择</b><span>MODEL CHOICE</span></div><div class=\"key-value\"><b>过程透明</b><span>TRANSPARENT</span></div><div class=\"key-value\"><b>可复现</b><span>REPRODUCIBLE</span></div></div></div>\n  <div><figure class=\"crop shot workbench-home full-gif\"><img alt=\"Open-Science 首页动态演示：运行中的研究任务、项目空间与最近研究会话\" src=\"/open-science/assets/d3c983de7250f454.gif\"><span class=\"gif-bottom-mask left\" aria-hidden=\"true\"></span><span class=\"gif-bottom-mask right\" aria-hidden=\"true\"></span></figure><div class=\"shot-caption\"><span>OPEN-SCIENCE · PROJECTS & SESSIONS</span><span>完整动态演示</span></div><div class=\"product-rail\"><span>提出问题</span><span>连接能力</span><span>真实执行</span><span>检查结果</span></div></div>\n </div>\n <p class=\"summary\">把研究问题、专业能力和真实执行，放进同一个工作台。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science 是研究工作环境，而不只是一个模型入口。</p><p>产品连接不同 AI 模型、专业科研技能和真实研究流程。研究者可以选择模型、Agent、算力与数据接入，并在同一个项目中查看研究材料和执行产物。</p><p>右侧动图展示首页中运行任务、项目空间与最近研究会话的动态状态；功能以用户提供的 v0.20.0 列表为准。</p><div class=\"sources\">[Sources]<br>功能列表.docx（嵌入功能库：稳定版 v0.20.0）；用户提供的 Open-Science 首页动图 飞书20260827-185650.gif；用户提供的 Open-Science 定义。</div></aside>\n</section>\n\n<section class=\"slide slide-dark commons\" data-page=\"05\" data-title=\"面向全球科研的公共空间\">\n <div class=\"kicker\">04 / THE GLOBAL SCIENTIFIC COMMONS</div>\n <h2 class=\"section-title\">一个工作台，<br>也是一块<span class=\"highlight-text\">全球科研公共空间</span></h2>\n <div class=\"content\">\n  <div><p class=\"community-intro\">以 Open-Science 为共同基础设施，<br>让不同领域的参与者在同一空间协作。</p><div class=\"commons-share\"><h3>社区共享的，不只是代码。</h3><p>代码 · 方法 · 能力包<br>工作流 · 验证记录 · 研究经验</p></div><a class=\"github-metric\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><span class=\"value\">3.1K</span><span class=\"metric-label\">GITHUB STARS<br>aipoch/open-science</span></a><p class=\"fine\" style=\"margin-top:13px\">GitHub 关注度 · 资料快照 2026.08</p></div>\n  <div class=\"commons-map\" data-community data-focus=\"\" aria-label=\"Open-Science 共享科研空间共建示意\">\n   <div class=\"commons-space-head\">ONE SHARED RESEARCH SPACE</div>\n   <figure class=\"commons-art\"><div class=\"commons-art-stage\"><img class=\"commons-art-base\" src=\"/open-science/assets/779f062f1c72ba11.png\" alt=\"圆形共享科研工作台中的四组参与者：左前方研究者分析数据，后方两人讨论方法，前方开发者编排工作流，右侧科研机构的三人实验组操作显微镜、移液器和样本。\"></div></figure>\n   <div class=\"commons-roles\" role=\"group\" aria-label=\"选择四类共建角色，查看协作方式\">\n    <button class=\"shared-role\" data-role=\"researcher\" aria-pressed=\"false\" aria-label=\"研究者共建路径\">研究者</button>\n    <button class=\"shared-role\" data-role=\"expert\" aria-pressed=\"false\" aria-label=\"领域专家共建路径\">领域专家</button>\n    <button class=\"shared-role\" data-role=\"developer\" aria-pressed=\"false\" aria-label=\"开发者共建路径\">开发者</button>\n    <button class=\"shared-role\" data-role=\"institution\" aria-pressed=\"false\" aria-label=\"科研机构共建路径\">科研机构</button>\n   </div>\n   <p class=\"commons-context\" id=\"commonsContext\" aria-live=\"polite\">点击角色，高亮对应小组，查看共建方式。</p>\n  </div>\n </div>\n <p class=\"summary commons-cycle\"><span class=\"cycle-label\">共建链路</span><span>使用能力</span><span class=\"cycle-arrow\">↔</span><span>交流问题</span><span class=\"cycle-arrow\">↔</span><span>检查方法</span><span class=\"cycle-arrow\">↔</span><span>贡献经验</span><span class=\"cycle-arrow\">↔</span><span>共同改进</span></p>\n <aside class=\"notes\"><p class=\"speaker-summary\">以 Open-Science 为核心，建设全球科研开源社区。</p><p>研究者可以使用他人贡献的科研能力，并反馈真实问题。领域专家可以将方法、规则与经验整理成 Specialist 或 Skill。开发者可以接入工具、数据源和工作流组件。实验室与科研机构可以参与验证、复现和合作研究。</p><p>社区共享的对象包括代码、方法、能力包（Skills / Specialists）、工作流、验证记录和研究经验；公开哪些材料应由贡献者自主决定。</p><p>共建链路：使用能力 ↔ 交流问题 ↔ 检查方法 ↔ 贡献经验 ↔ 共同改进。点击四类角色，可高亮圆形共享工作台中的对应小组，并查看各自的共建方式。图中仅保留四组：研究分析、方法讨论、开发工作、合作实验；科研机构对应右侧三人共同操作实验设备的场景。</p><p>右侧在原圆形共享科研空间插画上使用内置图像编辑工具修改：删除左侧未对应角色的两人，将右侧改为三人共同做实验，并补齐后半圈黄色连接，强化方法曲线与共享空间的联系。黑板外框保持灰色，不参与黄色交互高亮。此图为概念插画，并非实际办公空间、合作伙伴或在线协作界面。约 3.1K Stars 来自用户提供的 GitHub 截图，展示项目关注度，不是用户数或全球排名。</p><div class=\"sources\">[Sources]<br>四类共建角色及说明、社区共享对象与共建链路：用户明确提供。插画：内置 image_gen 编辑原圆形共享科研工作台，仅保留四组参与者，科研机构以三人实验组表示。编辑提示词见 commons-four-groups-prompt.txt 与 commons-expert-connection-prompt.txt、commons-gray-board-frame-prompt.txt。关注度：用户提供的 GitHub 搜索截图（2026-08-26 提供）。<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science GitHub 仓库</a></div></aside>\n</section>\n\n<section class=\"slide slide-surface capabilities\" data-page=\"06\" data-title=\"六大功能，贯穿一次研究旅程\" data-research-journey>\n <div class=\"kicker\">05 / A RESEARCHER’S JOURNEY</div>\n <h2 class=\"section-title\">一个研究问题，走向<span class=\"highlight-text\">可检查的结果</span></h2>\n <p class=\"subtitle\">以论文结果复现为例，六大功能系统接续同一项研究。</p>\n <div class=\"content\">\n  <div class=\"journey-task\"><span class=\"task-label\">示例任务</span><p>我有论文和数据，想复现其中的关键结果。</p><span class=\"journey-hint\">点击步骤，跟随研究过程 →</span></div>\n  <div class=\"journey-steps\" role=\"tablist\" aria-label=\"六大功能系统与研究者使用旅程\">\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-1\" aria-selected=\"true\" aria-controls=\"journey-panel-1\" aria-label=\"第1步 建立研究项目\" tabindex=\"0\" data-journey-step=\"0\"><span class=\"journey-dot\">01</span><span class=\"journey-action\">建立研究项目</span><span class=\"journey-capability\">研究项目与持续上下文</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-2\" aria-selected=\"false\" aria-controls=\"journey-panel-2\" aria-label=\"第2步 加载专业能力\" tabindex=\"-1\" data-journey-step=\"1\"><span class=\"journey-dot\">02</span><span class=\"journey-action\">加载专业能力</span><span class=\"journey-capability\">Specialist 与 Skill 生态</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-3\" aria-selected=\"false\" aria-controls=\"journey-panel-3\" aria-label=\"第3步 选择模型与环境\" tabindex=\"-1\" data-journey-step=\"2\"><span class=\"journey-dot\">03</span><span class=\"journey-action\">选择模型与环境</span><span class=\"journey-capability\">模型、算力与环境选择</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-4\" aria-selected=\"false\" aria-controls=\"journey-panel-4\" aria-label=\"第4步 确认计划并执行\" tabindex=\"-1\" data-journey-step=\"3\"><span class=\"journey-dot\">04</span><span class=\"journey-action\">确认计划并执行</span><span class=\"journey-capability\">科研执行与任务编排</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-5\" aria-selected=\"false\" aria-controls=\"journey-panel-5\" aria-label=\"第5步 查看研究产物\" tabindex=\"-1\" data-journey-step=\"4\"><span class=\"journey-dot\">05</span><span class=\"journey-action\">查看研究产物</span><span class=\"journey-capability\">文件、数据与研究产物</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-6\" aria-selected=\"false\" aria-controls=\"journey-panel-6\" aria-label=\"第6步 检查与复现\" tabindex=\"-1\" data-journey-step=\"5\"><span class=\"journey-dot\">06</span><span class=\"journey-action\">检查与复现</span><span class=\"journey-capability\">审计、溯源与可复现</span></button>\n  </div>\n  <div class=\"journey-stage\">\n   <div class=\"journey-panel\" id=\"journey-panel-1\" role=\"tabpanel\" aria-labelledby=\"journey-tab-1\" data-journey-panel=\"0\">\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 01 / 06</p><h3 class=\"journey-detail-title\">先明确：这次要复现什么？</h3><p class=\"journey-detail-copy\">创建项目，写清复现目标；加入论文与数据，让后续讨论都接着已有材料继续。</p><p class=\"journey-result\"><span>本步得到</span>包含目标和材料的研究项目</p><button class=\"journey-next\" data-journey-to=\"1\">下一步：加载专业能力 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.512437810945274\"><figure class=\"crop shot\" data-crop=\"project|444,338,505,201\" style=\"aspect-ratio:505/201\"><img src=\"/open-science/assets/d13cf784f5a9e6bd.png\" alt=\"Open-Science 创建项目界面：填写研究项目名称\" style=\"width:275.6435643564356%;left:-87.92079207920793%;top:-168.1592039800995%;height:auto\"></figure></div><figcaption>创建项目 · 确定目标与上下文 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-2\" role=\"tabpanel\" aria-labelledby=\"journey-tab-2\" data-journey-panel=\"1\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 02 / 06</p><h3 class=\"journey-detail-title\">让专业能力进入这次研究。</h3><p class=\"journey-detail-copy\">选择适合任务的 Specialist，查找并加载 Skill，按需接入工具和数据。</p><p class=\"journey-result\"><span>本步得到</span>为当前任务加载的专业能力</p><button class=\"journey-next\" data-journey-to=\"2\">下一步：选择模型与环境 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0668380462724936\"><figure class=\"crop shot\" data-crop=\"skills|599,386,804,389\" style=\"aspect-ratio:804/389\"><img src=\"/open-science/assets/860ec00c1fb345e1.png\" alt=\"Open-Science Skills 界面：搜索、添加与启用科研能力\" style=\"width:222.63681592039802%;left:-74.50248756218906%;top:-99.22879177377892%;height:auto\"></figure></div><figcaption>Skills · 查找并自主加载 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-3\" role=\"tabpanel\" aria-labelledby=\"journey-tab-3\" data-journey-panel=\"2\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 03 / 06</p><h3 class=\"journey-detail-title\">决定用什么工具，在哪里运行。</h3><p class=\"journey-detail-copy\">选择模型与 Agent，配置 Python / R 环境；需要时连接自己的远程算力。</p><p class=\"journey-result\"><span>本步得到</span>本次研究的模型与运行环境</p><button class=\"journey-next\" data-journey-to=\"3\">下一步：确认计划并执行 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.858974358974359\"><figure class=\"crop shot\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/675ebce5135a9a32.jpg\" alt=\"Open-Science 模型设置：选择模型服务商与接入方式\" style=\"width:176.55172413793105%;left:-51.724137931034484%;top:-38.46153846153847%;height:auto\"></figure></div><figcaption>Model · 自主选择研究使用的模型 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-4\" role=\"tabpanel\" aria-labelledby=\"journey-tab-4\" data-journey-panel=\"3\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 04 / 06</p><h3 class=\"journey-detail-title\">看过计划，再开始执行。</h3><p class=\"journey-detail-copy\">审阅计划与权限后，Agent 与 Sub-agents 分工执行，调用工具和代码；可查看进度、补充指导。</p><p class=\"journey-result\"><span>本步得到</span>运行记录、代码和中间结果</p><button class=\"journey-next\" data-journey-to=\"4\">下一步：查看研究产物 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5078534031413613\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,1146\" style=\"aspect-ratio:1728/1146\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science 研究计划确认界面：对话澄清、分阶段任务与 Approve 操作\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>研究计划 · 审阅步骤后确认执行 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-5\" role=\"tabpanel\" aria-labelledby=\"journey-tab-5\" data-journey-panel=\"4\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 05 / 06</p><h3 class=\"journey-detail-title\">结果生成后，直接打开检查。</h3><p class=\"journey-detail-copy\">在项目里查看图表、数据表和 Notebook，分屏对照已有材料，下载或导出成果。</p><p class=\"journey-result\"><span>本步得到</span>可供检查和交付的研究文件</p><button class=\"journey-next\" data-journey-to=\"5\">下一步：检查与复现 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.2113821138211383\"><figure class=\"crop shot\" data-crop=\"montage|350,100,1360,615\" style=\"aspect-ratio:1360/615\"><img src=\"/open-science/assets/cc5207fdea9c6cb8.png\" alt=\"Open-Science 项目中的生成文件与论文复现图表分屏预览\" style=\"width:131.61764705882354%;left:-25.735294117647058%;top:-16.260162601626014%;height:auto\"></figure></div><figcaption>产物预览 · 对照数据与图表 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-6\" role=\"tabpanel\" aria-labelledby=\"journey-tab-6\" data-journey-panel=\"5\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 06 / 06</p><h3 class=\"journey-detail-title\">遇到差异，就回到方法与证据。</h3><p class=\"journey-detail-copy\">对照原文，核查代码、参数与来源记录；检查方法和结果，必要时调整计划继续研究。</p><p class=\"journey-result\"><span>本步得到</span>记录一致项与差异的复查结论</p><button class=\"journey-next\" data-journey-to=\"3\">↶ 回到第 4 步，调整计划</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5391304347826087\"><figure class=\"crop shot\" data-crop=\"journeyReview|0,0,2124,1380\" style=\"aspect-ratio:2124/1380\"><img src=\"/open-science/assets/170cc0be788eeb29.jpg\" alt=\"Open-Science Session Reviewer：研究产物的一致性检查与审查记录\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>Reviewer · 检查结果与审查记录 · 点击放大</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">项目上下文、文件与来源记录贯穿全程；发现差异，可以回到前面的步骤继续研究。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">以论文结果复现为示例，把六大功能系统放进研究者的使用旅程。</p><p>研究者带着论文和数据创建项目，加载所需 Specialist 与 Skill，再选择模型、Agent 与运行环境。审阅计划后调用工具执行，查看生成的文件，并对照原文检查差异。每一步在页面中显示对应系统、用户操作和本步产物。</p><p>六个步骤是对使用旅程的概括，不是产品强制流程。项目上下文、文件管理、权限与来源记录贯穿全程，不只在某一步出现；用户可以随时回到前面的步骤。最后一步的按钮返回计划执行阶段，不代表后台已经重跑任务。</p><p>示例任务为讲解用情境，不是客户引言或效果承诺。所用截图来自不同版本的已有产品演示，展示对应界面，不声称是一次连续研究的完整录屏，也不将截图中的数值视为经过独立验证的科学结论。第 2 步展示能力管理界面，不代表列表中全部 Skill 均用于该复现任务；第 4 步使用用户提供的生物信息学研究计划截图，说明计划审阅与确认；第 6 步为用户提供的 Reviewer 界面，展示特定产物的一致性检查及审查记录，截图中的 PASS 不等同于对全部科学结论的独立验证。</p><p>功能范围基于用户提供的稳定版 v0.20.0 功能库。Desktop、Web、Mobile、CLI / Headless 的具体支持范围依端与环境而异。MedFlow 的专业工作流模块仍按后续页面的产品状态说明，不将规划内容混入本页现有执行能力。</p><div class=\"sources\">[Sources]<br>功能列表.docx：功能库｜当前稳定版 v0.20.0（2026-08-25）。使用旅程与论文复现场景基于用户提供的产品资料整理。<br>年中汇报：02-new-project.png、06-skills-settings.png、05-analysis-montage.png；Model 设置截图 20260730-225744.jpeg。<br>用户提供的 Session Plan / Approve 研究计划确认截图（2026-08-26）：step4-session-plan.png。<br>用户提供的 Session Reviewer 截图（2026-08-26）：step6-session-reviewer.jpg。</div></aside>\n</section>\n\n<section class=\"slide workspace\" data-page=\"07\" data-title=\"研究不会在一次对话结束\">\n <div class=\"kicker\">06 / RESEARCH WORKSPACE</div>\n <h2 class=\"section-title\">研究不会在<span class=\"highlight-text\">一次对话结束</span></h2>\n <p class=\"subtitle\">以项目组织研究，让上下文、材料与历史决策持续积累。</p>\n <div class=\"content workspace-gallery gallery\">\n  <div class=\"workspace-tabs\" role=\"tablist\" aria-label=\"研究项目持续性功能\">\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"workspace-project\"><span class=\"num\">01</span><span><b>项目与会话持续保存</b><small>同一项目内积累讨论、文件与成果。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-context\"><span class=\"num\">02</span><span><b>项目上下文</b><small>让每个会话继承共同目标与研究约束。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-branch\"><span class=\"num\">03</span><span><b>研究分支</b><small>从当前工作创建新会话，探索另一条路径。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-reference\"><span class=\"num\">04</span><span><b>跨会话引用与搜索</b><small>用 # 找到并引用已有研究会话。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-sidechat\"><span class=\"num\">05</span><span><b>研究过程中持续指导</b><small>通过 Side chat 补充建议与反馈。</small></span></button>\n  </div>\n  <div class=\"workspace-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"workspace-project\" style=\"--workspace-shot-ratio:1.7777777777777777\"><figure class=\"crop\" data-crop=\"workspaceProject|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/b222df7f22573047.jpg\" alt=\"Open-Science 项目全景：同一项目内保存多个研究会话、文件与成果\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project workspace · 多次研究持续积累</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-context\" style=\"--workspace-shot-ratio:.7689822294022617\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceContext|0,0,476,619\" style=\"aspect-ratio:476/619\"><img src=\"/open-science/assets/bd4267932c391f0f.jpg\" alt=\"Open-Science Project Settings：为项目填写 Agent Context\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project Agent Context · 共同目标与约束进入每个会话</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-branch\" style=\"--workspace-shot-ratio:1.8333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceBranch|600,800,1100,600\" style=\"aspect-ratio:1100/600\"><img src=\"/open-science/assets/4bb8c2a8d10c2112.jpg\" alt=\"Open-Science 从研究结果创建新会话分支的操作入口\" style=\"width:181.72727272727275%;left:-54.54545454545454%;top:-133.33333333333331%;height:auto\"></figure><figcaption>Branch in new session · 从已有工作继续探索</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-reference\" style=\"--workspace-shot-ratio:1.822\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceReference|0,0,911,500\" style=\"aspect-ratio:911/500\"><img src=\"/open-science/assets/beec2fa88029cfb7.jpg\" alt=\"Open-Science 输入井号后搜索并引用其他研究会话\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption># Session reference · 查找并接续已有研究</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-sidechat\" style=\"--workspace-shot-ratio:1.2857142857142858\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceSidechat|620,685,900,700\" style=\"aspect-ratio:900/700\"><img src=\"/open-science/assets/34b8bac0510d9049.png\" alt=\"Open-Science 研究运行过程中的 Side chat 指导界面\" style=\"width:191.66666666666669%;left:-68.88888888888889%;top:-97.85714285714285%;height:auto\"></figure><figcaption>Side chat · 在运行过程中补充建议与反馈</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">每次研究都接着已有工作继续，不必反复解释同一段背景。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">研究上下文属于项目，不应随着单次对话结束而消失。</p><p>页面用五个真实界面说明持续研究：项目保存多个会话与成果；Project Agent Context 为会话注入共同目标与约束；研究者可以从当前工作创建新会话分支；使用 # 搜索并引用其他会话；研究运行中可以通过 Side chat 补充建议。</p><p>跨会话引用使用 #，与 @ 文件引用区分。“继续研究”指恢复持久记录和上下文，不承诺所有中断的外部计算作业都会自动恢复。五张截图来自不同研究演示，仅说明相应功能，不声称是同一个研究项目的连续录屏。</p><div class=\"sources\">[Sources]<br>功能列表.docx（v0.20.0，含 Project Agent Context、Session References、Branch 与 Live Side-Chat Advice）。<br>用户提供的五张 Open-Science 产品截图（2026-08-26）：workspace-project.jpg、workspace-context.jpg、workspace-branch.jpg、workspace-reference.jpg、workspace-sidechat.png。</div></aside>\n</section>\n\n<section class=\"slide slide-surface freedom\" data-page=\"08\" data-title=\"把技术选择权留给研究者\">\n <div class=\"kicker\">07 / YOUR RESEARCH, YOUR STACK</div>\n <h2 class=\"section-title\">模型、Agent、算力和环境，<span class=\"highlight-text\">由你决定</span></h2>\n <p class=\"subtitle\">围绕研究任务选择工具，不必围绕某个工具改变研究方式。</p>\n <div class=\"content split\"><div class=\"freedom-list\">\n <div class=\"feature-line\"><span class=\"num\">01</span><div><h3>Agent 自由</h3><p>选择 Claude Code、OpenCode、Codex 等执行框架。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">02</span><div><h3>模型自由</h3><p>多模型服务、自定义网关、订阅接入与任务中切换。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">03</span><div><h3>算力自由</h3><p>使用本地资源，或连接自己的远程 SSH 主机。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">04</span><div><h3>环境自由</h3><p>Python / R / REPL，持久 Kernel 与环境管理。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">05</span><div><h3>数据自由</h3><p>接入自有材料、科研 Connector 和自定义 MCP。</p></div></div>\n </div><div class=\"gallery\" data-gallery=\"stack\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"技术选择截图\"><button role=\"tab\" aria-selected=\"true\" data-select=\"model\">Model</button><button role=\"tab\" aria-selected=\"false\" data-select=\"agent\">Agent</button><button role=\"tab\" aria-selected=\"false\" data-select=\"runtime\">Runtime</button><button role=\"tab\" aria-selected=\"false\" data-select=\"compute\">Compute</button><button role=\"tab\" aria-selected=\"false\" data-select=\"data\">Data</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"model\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/675ebce5135a9a32.jpg\" alt=\"模型服务商选择，包含 OpenAI、Anthropic、Grok、DeepSeek、GLM 和 Kimi\" style=\"width:176.55172413793105%;left:-51.724137931034484%;top:-38.46153846153847%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"agent\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"agent|765,530,1450,785\" style=\"aspect-ratio:1450/785\"><img src=\"/open-science/assets/9a16f4002be03931.jpg\" alt=\"Claude Agent、OpenCode 和 Codex 框架选择\" style=\"width:176.55172413793105%;left:-52.758620689655174%;top:-67.51592356687898%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"runtime\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"runtime|205,300,964,543\" style=\"aspect-ratio:964/543\"><img src=\"/open-science/assets/01d69d0de306625a.jpg\" alt=\"Python 与 R 的 Notebook 运行环境设置\" style=\"width:142.32365145228215%;left:-21.265560165975103%;top:-55.24861878453039%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"compute\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"compute|205,155,964,688\" style=\"aspect-ratio:964/688\"><img src=\"/open-science/assets/48d4c8976e22f68d.jpg\" alt=\"远程 SSH 计算主机设置\" style=\"width:142.32365145228215%;left:-21.265560165975103%;top:-22.52906976744186%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"data\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"connectors|0,0,968,445\" style=\"aspect-ratio:968/445\"><img src=\"/open-science/assets/aad490288fa24051.jpg\" alt=\"Open-Science Connectors 页面：接入科研数据服务、本地命令、远程 MCP 服务或配置文件\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div>\n </div><div class=\"shot-caption\"><span>CHOOSE YOUR STACK</span><span>点击标签切换真实截图</span></div><p class=\"small-note\">选择第三方模型、远程服务或数据连接器时，数据传输与费用取决于所选服务及配置。</p></div></div>\n <p class=\"summary\">技术组合可以更换，研究目标与选择权始终属于研究者。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">模型自由不是无需模型，也不是所有第三方服务免费。</p><p>五个自由分别对应 Agent、模型、算力、环境和数据。功能库确认多提供商、自定义网关、订阅登录、模型热切换、Python/R/REPL 内核、环境管理、SSH 远程计算、科研连接器和自定义 MCP。</p><p>Data 标签展示 Connectors 管理页：研究者可以浏览科研连接器，也可以通过本地命令、远程 MCP 服务或导入配置添加连接器。截图中的具体连接器仅为产品界面示例。</p><p>使用云端模型、远程端点或第三方连接器时，相关请求可能发送给所选服务；本地优先不等于任何配置下数据都不会离开设备。部分功能受框架、服务和执行环境限制。</p><div class=\"sources\">[Sources]<br>功能列表.docx（v0.20.0）；年中汇报 openscience-20260730 中的模型、Agent、Runtime、Compute 截图。<br>用户提供的 Open-Science Connectors 截图（2026-08-27）：data-connectors.jpg。</div></aside>\n</section>\n\n<section class=\"slide ecosystem\" data-page=\"09\" data-title=\"全球科研能力，按需加载\">\n <div class=\"kicker\">08 / SPECIALISTS & SKILLS</div>\n <h2 class=\"section-title\">全球科研能力，<span class=\"highlight-text\">按需加载</span></h2>\n <p class=\"subtitle\">多学科 Specialist 组织专业能力，开放 Skills 将方法转化为可执行行动。</p>\n <div class=\"content\"><div class=\"gallery\" data-gallery=\"capabilities\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"科研能力截图\"><button role=\"tab\" aria-selected=\"false\" data-select=\"specialists\">Specialists</button><button role=\"tab\" aria-selected=\"true\" data-select=\"skills\">Skills</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel\" data-panel=\"specialists\" role=\"tabpanel\"><figure class=\"crop specialist-shot\" data-crop=\"specialists|160,300,960,530\" style=\"aspect-ratio:960/530\"><img src=\"/open-science/assets/491a3968cb94db41.png\" alt=\"Specialist Marketplace：空气动力学、天文测光和大气化学等实际专家包\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-56.60377358490566%;height:auto\"></figure></div>\n <div class=\"gallery-panel active\" data-panel=\"skills\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"skillsLatest|160,150,960,560\" style=\"aspect-ratio:960/560\"><img src=\"/open-science/assets/a5240cb3645ee9d5.png\" alt=\"Open-Science Skills：浏览、启用、上传、从 GitHub 导入或创建科研 Skill\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-26.785714285714285%;height:auto\"></figure></div></div><div class=\"skill-points\"><p><span>01</span><span class=\"skill-copy\"><b>覆盖 8+ 学科方向：</b>生命科学、医学、化学、物理、天文、环境科学、工程与数据科学。</span></p><p><span>02</span><span class=\"skill-copy\"><b>自由加载、创建与分享：</b>按需组合；自然语言创建、上传或从 GitHub 导入，并发布至 Marketplace。</span></p></div></div>\n <div><div class=\"sources-head\"><span class=\"label\">OPEN SKILL MARKETPLACE · USE & CONTRIBUTE</span></div>\n <a class=\"source-row\" href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/cd170c5207db62ba.png\" alt=\"K-Dense 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">K-Dense <span class=\"source-stats\">34.8K ★ ↗</span></div><p class=\"source-desc\">Scientific Agent Skills · 多学科科研与分析</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/4124b8d03b154d23.png\" alt=\"Anthropic 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">Claude Skills <span class=\"source-stats\">171.9K ★ ↗</span></div><p class=\"source-desc\">Anthropic 官方 Agent Skills · 文档、设计与开发工作流</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/5d9fa88bda04c547.png\" alt=\"Google DeepMind 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">Google DeepMind <span class=\"source-stats\">2.8K ★ ↗</span></div><p class=\"source-desc\">Science Skills · 基因组学、结构生物学与检索</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo nature-logo\" src=\"/open-science/assets/3b16f5fd9a4fca0f.png\" alt=\"Nature Skills 项目标识\"><div class=\"source-copy\"><div class=\"source-name\">Nature Skills <span class=\"source-stats\">37.3K ★ ↗</span></div><p class=\"source-desc\">科研检索、写作、绘图、审稿与研究记录</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/9cc9bee9a501b541.png\" alt=\"NVIDIA 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">NVIDIA BioNeMo <span class=\"source-stats\">434 ★ ↗</span></div><p class=\"source-desc\">生命科学 Agent Toolkit · 蛋白、分子与基因组</p></div></a>\n <div class=\"marketplace-contribute\"><span class=\"contribute-mark\">＋</span><div><b>YOUR SKILL → MARKETPLACE</b><p>上传并发布，让全球研究者加载、验证、复用与共同改进。</p></div></div>\n </div>\n </div>\n <p class=\"summary\">发现 → 加载 → 使用 → 创建 → 发布至 Marketplace → 社区复用与改进</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">研究者既是开放科研能力的使用者，也可以成为能力贡献者。</p><p>Specialist 是面向特定专业任务的能力包，可包含专属 Skills 与 Connectors；Skill 是可独立调用和组合的科研能力单元。Open-Science 支持按需启停，上传 Skill 包，从 GitHub 或本地已安装目录导入，也可以通过对话或编辑器创建个人 Skill。</p><p>用户创建或维护的 Skill 可以发布到 Marketplace，供全球研究者加载、验证、复用、反馈并共同改进，由此形成“使用—创建—发布—复用—改进”的开放共享生态。</p><p>页面列出的八类学科方向是对当前代表性 Specialist 与开放 Skill 集合的概括，并非固定分类上限。GitHub Stars 来自 GitHub API，统计快照为 2026-08-27。</p><div class=\"sources\">[Sources]<br>用户提供的 Open-Science Skills 截图（2026-08-27）、Specialist Marketplace 截图（2026-08-26）、功能列表.docx；用户确认 Skill 可上传并发布到 Marketplace（2026-08-27）。<br><a href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\">K-Dense Scientific Agent Skills</a><br><a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">Anthropic Skills</a><br><a href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\">Google DeepMind Science Skills</a><br><a href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\">Nature Skills</a><br><a href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\">NVIDIA BioNeMo Agent Toolkit</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark execution\" data-page=\"10\" data-title=\"从科研能力，到真实研究执行\">\n <div class=\"kicker\">09 / SCIENTIFIC EXECUTION</div>\n <h2 class=\"section-title\">从科研能力，<span class=\"highlight-text\">到真实研究执行</span></h2>\n <p class=\"subtitle\">研究者输入任务，主 Agent 生成 Plan；确认后，Sub-agents 并行执行，Reviewer Specialist 独立检查结果。</p>\n <div class=\"execution-interactive gallery\" data-gallery=\"execution\">\n  <div class=\"execution-tabs\" role=\"tablist\" aria-label=\"真实研究执行的四个阶段\">\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"execution-plan\"><span class=\"execution-num\">01</span><span><b>输入任务，生成 Plan</b><small>Agent 规划，研究者确认</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-delegate\"><span class=\"execution-num\">02</span><span><b>拆解任务，并行分工</b><small>Main Agent → Sub-agents</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-run\"><span class=\"execution-num\">03</span><span><b>调用真实工具执行</b><small>Skill · Connector · Compute</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-review\"><span class=\"execution-num\">04</span><span><b>Reviewer Specialist 检查</b><small>方法 · 证据 · 结论 · 记录</small></span></button>\n  </div>\n  <div class=\"execution-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"execution-plan\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / TASK → PLAN → APPROVE</strong><span>研究方向由研究者确认</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,900\" style=\"aspect-ratio:1728/900\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science：研究者输入任务后，Agent 生成结构化 Session Plan，等待确认\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>AGENT BUILDS A STRUCTURED PLAN</span><span>目标 · 步骤 · 边界 · 交付物</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-delegate\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / MAIN AGENT → SUB-AGENTS</strong><span>复杂任务被拆成多个专业任务</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"subagents|75,250,900,340\" style=\"aspect-ratio:900/340\"><img src=\"/open-science/assets/6dac6a590e97efcb.png\" alt=\"Open-Science：主 Agent 将研究任务委派给 5 个 Sub-agents，并显示各任务的完成状态\" style=\"width:115.44444444444444%;left:-8.333333333333332%;top:-73.52941176470588%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>DELEGATED TO 5 SUB-AGENTS</span><span>任务名称 · 专业角色 · 执行状态</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-run\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / EXECUTE IN REAL ENVIRONMENTS</strong><span>工具调用与运行状态持续可见</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"live|0,0,2400,1400\" style=\"aspect-ratio:2400/1400\"><img src=\"/open-science/assets/afcbc08c4390f82c.webp\" alt=\"Open-Science 官方演示：Agent 调用真实工具执行研究任务并生成研究产物\" style=\"width:160%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SKILL · CONNECTOR · PYTHON / R · REMOTE COMPUTE</span><span>运行 · 状态 · 产物</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-review\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / REVIEWER SPECIALIST</strong><span>独立检查，不替代专业判断</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"journeyReview|0,0,2124,1100\" style=\"aspect-ratio:2124/1100\"><img src=\"/open-science/assets/170cc0be788eeb29.jpg\" alt=\"Open-Science Session Reviewer：逐项检查研究计划、执行记录与产物之间的一致性\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PLAN · EXECUTION · ARTIFACT · CLAIM</span><span>方法 · 证据 · 结论 · 记录</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">研究者控制方向，Agent 负责组织，Sub-agents 负责执行，Reviewer Specialist 负责检查。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">研究者输入任务，主 Agent 生成 Plan；确认后，Sub-agents 分工执行并汇总产物，Reviewer Specialist 再独立检查结果。</p><p>本页是可切换的四阶段产品演示。点击左侧 01—04，可以分别查看 Plan、分工、真实执行和 Reviewer 检查。Agent 首先根据任务与项目上下文生成结构化 Plan，列出目标、步骤、边界与交付物；研究者检查并确认后，主 Agent 才拆解任务并协调执行。</p><p>Sub-agents 分别承担问题澄清、文献收集、证据映射、差距识别与研究路径选择等专业任务，并调用 Skill、Connector、Python / R、本地或远程计算环境。每个 Sub-agent 的任务、角色与执行状态都可以查看。产物形成后，Reviewer Specialist 对方法、证据、结论与执行记录进行检查；Reviewer 是检查机制，不代表科学结论得到保证。</p><p>四个阶段均使用真实产品界面；不同截图用于说明相应功能，不声称来自同一次连续运行。</p><div class=\"sources\">[Sources]<br>功能列表.docx（Plan、Sub-agents、Reviewer、Skill、Connector、执行环境与研究产物相关功能）；用户确认本页逻辑（2026-08-27）。<br>用户提供的 Session Plan、5 Sub-agents 与 Session Reviewer 产品截图（2026-08-26—27）；<a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science 官方产品演示</a><br><a href=\"https://statics.aipoch.com/public/f/image/figma-5fcb02c8.webp\" target=\"_blank\" rel=\"noopener\">研究执行与结果截图原图</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark evidence\" data-page=\"11\" data-title=\"材料与结果集中管理，全过程可追溯\">\n <div class=\"kicker\">10 / DATA, ARTIFACTS & TRUST</div>\n <h2 class=\"section-title\">研究材料与结果集中管理，<br>全过程<span class=\"highlight-text\">可检查、可追溯</span></h2>\n <p class=\"subtitle\">从材料进入项目，到成果生成与交付，关键过程始终可以查看。</p>\n <div class=\"evidence-interactive gallery\" data-gallery=\"evidence\">\n  <div class=\"evidence-tabs\" role=\"tablist\" aria-label=\"研究材料与结果的四个管理环节\">\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"evidence-materials\"><span class=\"evidence-num\">01</span><span><b>MATERIALS｜材料管理</b><small>项目文件、≤ 10 GB 附件与 @ / # 引用。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-artifacts\"><span class=\"evidence-num\">02</span><span><b>ARTIFACTS｜成果预览</b><small>数据、Notebook、图表和报告直接查看与导出。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-provenance\"><span class=\"evidence-num\">03</span><span><b>PROVENANCE｜来源追踪</b><small>Execution Log 关联代码、工具调用与运行输出。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-control\"><span class=\"evidence-num\">04</span><span><b>CONTROL｜操作控制</b><small>权限模式、逐项授权和 Auto-review 由研究者设置。</small></span></button>\n  </div>\n  <div class=\"evidence-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"evidence-materials\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / MATERIALS</strong><span>上传、集中管理并在研究中引用</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"evidenceMaterials|0,500,2113,820\" style=\"aspect-ratio:2113/820\"><img src=\"/open-science/assets/840a5021386b1c69.jpg\" alt=\"Open-Science Files：集中查看上传材料和生成文件，并通过 @ 在会话中引用文件\" style=\"width:100%;left:0%;top:-60.97560975609756%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PROJECT FILES · UPLOADS · GENERATED FILES</span><span>@ FILES · # SESSIONS</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-artifacts\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / ARTIFACTS</strong><span>成果在同一项目中直接查看与交付</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"montage|340,90,1390,550\" style=\"aspect-ratio:1390/550\"><img src=\"/open-science/assets/cc5207fdea9c6cb8.png\" alt=\"Open-Science：研究会话、生成文件与多格式科研图表的分屏预览\" style=\"width:128.77697841726618%;left:-24.46043165467626%;top:-16.363636363636363%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>DATA · NOTEBOOK · FIGURE · REPORT</span><span>预览 · 分屏 · 下载 · 导出</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-provenance\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / PROVENANCE</strong><span>从产物回到代码、工具调用和输出</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"evidenceProvenance|0,0,1036,420\" style=\"aspect-ratio:1036/420\"><img src=\"/open-science/assets/f9c447a7b173ed47.png\" alt=\"Open-Science Execution Log：显示 Notebook 代码、科研工具调用、运行输入与输出\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>CODE · EXECUTION LOG · ENVIRONMENT</span><span>运行过程持续保留</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-control\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / CONTROL</strong><span>研究者决定 Agent 可以执行什么</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot\" data-crop=\"evidenceControl|190,100,1150,448\" style=\"aspect-ratio:1150/448\"><img src=\"/open-science/assets/7d9800fd7fd1dcab.jpg\" alt=\"Open-Science Permission mode：按需询问、自动批准编辑或开放访问，并管理会话授权与 Auto-review\" style=\"width:132.08695652173915%;left:-16.52173913043478%;top:-22.321428571428573%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>ASK · AUTO-APPROVE · FULL ACCESS</span><span>会话权限 · Auto-review</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">从研究材料到最终成果，过程始终可查看、可追溯、可控制。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">材料、产物、执行记录与操作权限在同一个项目中保持关联。</p><p>本页可点击左侧四个标签切换真实产品截图。Materials 展示上传文件、生成文件及 @ 引用入口；Artifacts 展示多格式研究产物和分屏预览；Provenance 展示 Execution Log 中保留的代码、工具调用与运行输出；Control 展示权限模式、本次会话允许能力与 Auto-review 设置。</p><p>文件能力包括最高 10 GB 附件、项目文件库、@ 文件与路径引用、# 跨会话引用，以及数据、Notebook、图片、PDF、Office 和化学结构等内容预览。支持范围与限制依具体端、环境和文件类型而异。权限模式由研究者配置；Full access 的使用应结合数据敏感性与研究环境谨慎决定。</p><p>截图来自不同研究演示，仅说明相应功能，不声称属于同一次连续运行；其中展示的科研内容不是经过独立验证的科研或临床结论。</p><div class=\"sources\">[Sources]<br>功能列表.docx（v0.20.0）；年中汇报截图 05-analysis-montage.png。<br>用户提供的 Files / Artifacts、Execution Log 与 Permission mode 产品截图（2026-08-27）。</div></aside>\n</section>\n\n<section class=\"slide architecture\" data-page=\"12\" data-title=\"AIPOCH 构建开放的科研基础设施\">\n <div class=\"kicker\">11 / THE AIPOCH PRODUCT ARCHITECTURE</div>\n <h2 class=\"section-title\">AIPOCH 构建<span class=\"highlight-text\">开放的科研基础设施</span></h2>\n <p class=\"subtitle\">Open-Science 是面向研究者与全球社区的开放入口，底层由专业能力、执行引擎与技术服务共同支撑。</p>\n <div class=\"content\"><img class=\"architecture-image\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"AIPOCH 产品架构建筑：服务、能力、执行与开放科研空间\">\n <div class=\"architecture-layers\">\n <div class=\"architecture-layer\"><div class=\"en\">01 / OPEN RESEARCH SPACE</div><h3>Open-Science</h3><p>面向研究者的开放科研工作台与社区入口</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">02 / EXECUTION ENGINE</div><h3>MedFlow <span class=\"status planned\" style=\"margin-left:14px\">规划中</span></h3><p>将专业能力组织为可执行、可恢复的科研 Workflow</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">03 / SCIENTIFIC CAPABILITIES</div><h3>Specialists · Skills · Connectors</h3><p>MedSkillAudit 审计与评测 Skill，逐步建设 Benchmark 与能力榜单</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">04 / TECHNICAL FOUNDATION</div><h3>Model · Agent · Compute</h3><p>Environment · Data：提供运行环境与数据服务</p></div>\n </div><span class=\"architecture-pin\" style=\"left:1135px;top:81px\">01</span><span class=\"architecture-pin\" style=\"left:1050px;top:199px\">02</span><span class=\"architecture-pin\" style=\"left:1090px;top:309px\">03</span><span class=\"architecture-pin\" style=\"left:1040px;top:439px\">04</span><div class=\"architecture-community\"><strong>全球科研开源社区</strong>　贡献 · 验证 · 协作 · 复用</div></div>\n <p class=\"summary\">AIPOCH 将模型、工具与科研经验组织成可执行的科学能力，并通过 Open-Science 向全球社区开放。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">这一页从 AIPOCH 的公司维度解释产品架构：Open-Science 是开放入口，底层由执行引擎、专业能力与技术服务共同支撑。</p><p>顶层开放空间是 Open-Science，承载项目、会话、上下文、文件与研究成果；MedFlow 是专业执行引擎，将验证后的能力组织为可执行、可恢复的 Workflow；能力层包含 Specialists、Skills 与 Connectors，MedSkillAudit 负责 Skill 审计与评测，并将逐步形成 Benchmark 与能力榜单；基础层提供 Model、Agent、Compute、Environment 与 Data。</p><p>这是概念架构，不是实际部署拓扑。建筑外围代表全球科研开源社区，参与能力贡献、验证、协作与复用。</p><p>MedFlow 仍按官网公开状态标注规划中。</p><div class=\"sources\">[Sources]<br>年中汇报建筑图 page8-architecture-20260730-bgmatch.png；用户确认的架构迁移概念；功能列表.docx；<a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH 官网产品状态</a>。</div></aside>\n</section>\n\n<section class=\"slide slide-dark cobuild\" data-page=\"13\" data-title=\"全球社区共同扩展能力边界\">\n <div class=\"kicker\">12 / BUILT BY THE RESEARCH COMMUNITY</div>\n <h2 class=\"section-title\">全球社区，共同扩展<span class=\"highlight-text\">能力边界</span></h2>\n <p class=\"subtitle\">社区贡献专业能力，AIPOCH 提供持续共建的基础设施与协作机制。</p>\n <div class=\"content\"><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">RESEARCHERS</div><h3>研究者</h3><p>使用社区贡献的科研能力，<br>并反馈真实问题。</p></div><div class=\"role\"><div class=\"role-en\">DOMAIN EXPERTS</div><h3>领域专家</h3><p>将方法、规则与经验整理为<br>Specialist 或 Skill。</p></div></div><div class=\"community-core\"><div class=\"radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><div><strong>Open-Science</strong><span class=\"mini\">OPEN TO CONTRIBUTION</span></div></div><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">DEVELOPERS</div><h3>开发者</h3><p>接入工具、数据源与<br>工作流组件。</p></div><div class=\"role\"><div class=\"role-en\">RESEARCH INSTITUTIONS</div><h3>科研机构</h3><p>参与验证、复现与<br>合作研究。</p></div></div></div>\n <div class=\"community-support\"><div class=\"support-brand\"><img class=\"community-sticker\" src=\"/open-science/assets/fc401060a5053e19.png\" alt=\"Hi, AIPOCH 像素贴纸：AIPOCH 社区支持\"><div><span>AIPOCH / COMMUNITY INITIATOR</span><b>作为社区的发起者<br>与推动者</b></div></div><div class=\"support-items\"><div class=\"support-item\"><small>01 / INFRASTRUCTURE</small><strong>开放基础设施</strong></div><div class=\"support-item\"><small>02 / WORKSHOPS</small><strong>线上线下 Workshop</strong></div><div class=\"support-item\"><small>03 / CO-RESEARCH</small><strong>课题组项目合作</strong></div><div class=\"support-item\"><small>04 / MARKETPLACE</small><strong>Skill &amp; Specialist<br>资源市场</strong></div></div></div>\n <aside class=\"notes\"><p class=\"speaker-summary\">社区贡献专业能力，AIPOCH 提供能够持续发生共建的基础设施、活动与合作机制。</p><p>社区侧仍然只设研究者、领域专家、开发者和科研机构四类角色。研究者使用能力并反馈真实问题；领域专家沉淀 Specialist 或 Skill；开发者接入工具、数据源和工作流组件；科研机构参与验证、复现与合作研究。</p><p>AIPOCH 不作为第五类社区角色，而是社区的发起者与推动者，提供开放基础设施、线上线下 Workshop、课题组项目合作，以及 Skill & Specialist 资源市场。公开什么内容由贡献者自主选择，不要求公开私有研究数据；项目合作需根据具体课题另行确认。</p><div class=\"sources\">[Sources]<br>用户明确的全球科研开源社区定位、四类共建角色及 AIPOCH 社区支持方案；视觉素材由用户提供并处理为像素贴纸。</div></aside>\n</section>\n\n<section class=\"slide slide-surface flywheel\" data-page=\"14\" data-title=\"一次贡献，成为下一次发现的起点\">\n <div class=\"kicker\">13 / KNOWLEDGE THAT OTHERS CAN BUILD ON</div>\n <h2 class=\"section-title\">一次贡献，可以成为<br>下一次<span class=\"highlight-text\">科学发现的起点</span></h2>\n <div class=\"content\"><div><p class=\"body-text\">让真实研究中的方法与经验，经过验证、发布和复用，持续回到新的研究中。</p><div class=\"participation\"><div><b>USE</b><span>使用开放能力</span></div><div><b>CONTRIBUTE</b><span>贡献方法与组件</span></div><div><b>VALIDATE</b><span>审查、复现与反馈</span></div><div><b>CO-CREATE</b><span>围绕真实问题合作</span></div></div><p class=\"fine\" style=\"margin-top:29px\">我们希望与全球社区共同建立的协作机制。</p></div><div class=\"wheel\"><div class=\"wheel-track\"></div><div class=\"wheel-center\">共享的<br>科研能力<small>REUSABLE · VERIFIABLE</small></div><div class=\"wheel-node wn1\"><b>01</b><span>真实问题</span><small>从科研需求出发</small></div><div class=\"wheel-node wn2\"><b>02</b><span>协作研究</span><small>连接不同专业</small></div><div class=\"wheel-node wn3\"><b>03</b><span>沉淀能力</span><small>Skill / Workflow</small></div><div class=\"wheel-node wn4\"><b>04</b><span>审查验证</span><small>方法、边界与结果</small></div><div class=\"wheel-node wn5\"><b>05</b><span>发布复用</span><small>保留来源与版本</small></div><div class=\"wheel-node wn6\"><b>06</b><span>反馈改进</span><small>新的案例与贡献</small></div></div></div>\n <p class=\"summary\">让一次研究积累的经验，成为更多研究者可以继续使用的能力。</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">当经验可以被验证、复用和改进，一次贡献就能进入更多人的研究过程。</p><p>社区共建循环：真实问题、协作研究、沉淀能力、审查验证、发布复用，再由新的使用带来反馈。沉淀的对象可以是 Specialist、Skill、Connector 或 Workflow。</p><p>这页表达希望共同形成的社区机制，不表示所有审核、发布、治理和合作流程都已作为产品功能上线。</p><div class=\"sources\">[Sources]<br>用户确认的社区愿景与共建循环方案。</div></aside>\n</section>\n\n<section class=\"slide slide-dark closing\" data-page=\"15\" data-title=\"Build Science in the Open\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"连接全球社区的开放科研基础设施\">\n <div class=\"kicker\" style=\"color:#b4b4ae\">AIPOCH / OPEN-SCIENCE</div>\n <h2 class=\"closing-title\">Build Science<br>in the <span class=\"highlight-text en\">Open.</span></h2>\n <p class=\"closing-sub\">让专业科研能力触手可及，<br>让选择权回到研究者手中。</p>\n <div class=\"closing-label\">A GLOBAL<br>OPEN-SOURCE<br>RESEARCH COMMUNITY</div>\n <div class=\"closing-links\"><a class=\"closing-link\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><b>使用 Open-Science ↗</b><span>AIPOCH.COM/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><b>参与开源共建 ↗</b><span>GITHUB.COM/AIPOCH/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\"><b>开展科研合作 ↗</b><span>AIPOCH.COM/CONTACT-US</span></a></div>\n <a class=\"qr-block\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><img src=\"/open-science/assets/fe24c474cce9b5ba.svg\" alt=\"扫描二维码访问 Open-Science 官方产品页面\"><p>扫描进入 Open-Science</p></a>\n <aside class=\"notes\"><p class=\"speaker-summary\">让研究在开放中进行，让科研能力在合作中积累。</p><p>三个行动入口：开始使用 Open-Science；通过 GitHub 提交反馈、代码、文档或能力贡献；通过 AIPOCH 官网联系团队开展科研合作。合作邮箱尚未由用户确认，因此使用已核实的官网联系页面，不编造邮箱。</p><p>二维码指向 https://aipoch.com/open-science。所有产品内容用于科学研究介绍，研究输出仍需专业审阅。</p><div class=\"sources\">[Sources]<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science 官方产品页</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">开源仓库</a><br><a href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\">官方联系入口</a><br>建筑素材：AIPOCH 年中汇报。</div></aside>\n</section>\n</main></div>\n<div class=\"key-hint\">← → 翻页　O 目录　N 讲稿　F 全屏</div>\n<nav class=\"controls\" aria-label=\"演示控制\"><button id=\"prevBtn\" aria-label=\"上一页\" title=\"上一页（←）\">←</button><span id=\"slideCounter\" class=\"counter\" aria-live=\"polite\">01 / 15</span><button id=\"nextBtn\" aria-label=\"下一页\" title=\"下一页（→）\">→</button><span class=\"sep\"></span><button id=\"overviewBtn\" aria-label=\"打开目录\" title=\"目录（O）\">目录</button><button id=\"notesBtn\" aria-label=\"打开讲稿\" title=\"讲稿与来源（N）\">讲稿</button><button id=\"fullBtn\" aria-label=\"全屏演示\" title=\"全屏（F）\">全屏</button><button id=\"helpBtn\" aria-label=\"使用帮助\" title=\"快捷键与打印\">?</button></nav>\n<dialog id=\"overviewDialog\" aria-labelledby=\"overviewTitle\"><div class=\"dialog-head\"><h2 id=\"overviewTitle\">Open-Science · 15 页目录</h2><button data-close=\"overviewDialog\" aria-label=\"关闭目录\">关闭 ×</button></div><div id=\"overviewGrid\" class=\"overview-grid\"></div></dialog>\n<dialog id=\"notesDialog\" aria-labelledby=\"notesTitle\"><div class=\"dialog-head\"><h2 id=\"notesTitle\">讲稿与来源</h2><button data-close=\"notesDialog\" aria-label=\"关闭讲稿\">关闭 ×</button></div><div id=\"notesContent\" class=\"notes-content\"></div></dialog>\n<dialog id=\"imageDialog\" aria-labelledby=\"imageTitle\"><div class=\"dialog-head\"><h2 id=\"imageTitle\">产品截图</h2><button data-close=\"imageDialog\" aria-label=\"关闭截图\">关闭 ×</button></div><div id=\"imageZoom\"></div></dialog>\n<dialog id=\"helpDialog\" aria-labelledby=\"helpTitle\"><div class=\"dialog-head\"><h2 id=\"helpTitle\">演示帮助</h2><button data-close=\"helpDialog\" aria-label=\"关闭帮助\">关闭 ×</button></div><div class=\"help-list\"><div><kbd>← / →</kbd>上一页 / 下一页</div><div><kbd>Space</kbd>下一页</div><div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>O</kbd>打开或关闭目录</div><div><kbd>N</kbd>打开或关闭讲稿</div><div><kbd>F</kbd>进入或退出全屏</div><div><kbd>H</kbd>隐藏或显示控制条</div><div><kbd>Esc</kbd>关闭浮层</div></div><p style=\"font-size:16px;color:#777;line-height:1.8;margin-top:25px\">触屏可左右滑动翻页。第 07—11 页可点击标签切换产品功能与真实截图；点击页面内截图可查看完整原图。图片与样式已嵌入，文件可离线打开；访问外部链接需要网络。浏览器打印可输出全部 15 页，建议开启背景图形。</p><button id=\"printBtn\" style=\"margin-top:20px;border:1px solid #ccc;background:#f1dd67;padding:11px 19px;color:#111\">打印 / 保存为 PDF</button></dialog>\n<div id=\"toast\" class=\"toast\" role=\"status\"></div>\n<script>\n(()=>{'use strict';\n const slides=[...document.querySelectorAll('.slide')], deck=document.getElementById('deck');\n const total=slides.length, dialogs=[...document.querySelectorAll('dialog')];\n let current=0, touchX=0, touchY=0, touchTarget=null, toastTimer;\n const clamp=n=>Math.max(0,Math.min(total-1,n));\n function fit(){document.documentElement.style.setProperty('--scale',String(Math.min(innerWidth/1600,innerHeight/900)));}\n function syncNotes(){document.getElementById('notesTitle').textContent=`${String(current+1).padStart(2,'0')} / ${slides[current].dataset.title}`;document.getElementById('notesContent').innerHTML=slides[current].querySelector('.notes').innerHTML;}\n function showSlide(n,updateHash=true){current=clamp(n);slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true');s.inert=i!==current;});deck.classList.toggle('chrome-light',!slides[current].classList.contains('slide-dark'));document.getElementById('slideCounter').textContent=`${String(current+1).padStart(2,'0')} / ${total}`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===total-1;document.getElementById('progressFill').style.width=((current+1)/total*100)+'%';document.querySelectorAll('.overview-item').forEach((b,i)=>b.setAttribute('aria-current',i===current?'true':'false'));if(updateHash){try{history.replaceState(null,'',`#slide-${String(current+1).padStart(2,'0')}`);}catch{}}syncNotes();}\n function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300);}\n function toggleDialog(id){const d=document.getElementById(id);if(d.open){d.close();return;}dialogs.forEach(x=>x.open&&x.close());if(id==='notesDialog')syncNotes();d.showModal();}\n async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('当前浏览器不支持全屏，请使用浏览器的全屏菜单。');}catch{toast('可使用浏览器菜单进入全屏。');}}\n document.getElementById('prevBtn').addEventListener('click',()=>showSlide(current-1));document.getElementById('nextBtn').addEventListener('click',()=>showSlide(current+1));document.getElementById('overviewBtn').addEventListener('click',()=>toggleDialog('overviewDialog'));document.getElementById('notesBtn').addEventListener('click',()=>toggleDialog('notesDialog'));document.getElementById('fullBtn').addEventListener('click',fullscreen);document.getElementById('helpBtn').addEventListener('click',()=>toggleDialog('helpDialog'));document.getElementById('printBtn').addEventListener('click',()=>{document.getElementById('helpDialog').close();window.print();});\n document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));\n document.querySelectorAll('.slide .shot').forEach(shot=>{shot.setAttribute('role','button');shot.setAttribute('tabindex','0');shot.setAttribute('aria-label','查看完整产品截图');shot.setAttribute('title','点击查看未裁切的完整原图');const open=()=>{const source=shot.matches('.crop')?shot:shot.querySelector('.gallery-panel.active .crop');if(!source)return;const sourceImage=source.querySelector('img');if(!sourceImage)return;const full=document.createElement('figure');full.className='full-image-zoom';const image=sourceImage.cloneNode(true);image.removeAttribute('style');const width=sourceImage.naturalWidth||1,height=sourceImage.naturalHeight||1;full.style.setProperty('--zoom-ratio',String(width/height));full.append(image);document.getElementById('imageZoom').replaceChildren(full);document.getElementById('imageTitle').textContent=sourceImage.alt;toggleDialog('imageDialog');};shot.addEventListener('click',open);shot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();open();}});});\n dialogs.forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));\n const overview=document.getElementById('overviewGrid');slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-item';b.setAttribute('aria-label',`跳转第${i+1}页 ${s.dataset.title}`);const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const text=document.createElement('span');text.textContent=s.dataset.title;b.append(num,text);b.addEventListener('click',()=>{showSlide(i);document.getElementById('overviewDialog').close();});overview.append(b);});\n const journey=document.querySelector('[data-research-journey]');\n if(journey){\n  const steps=[...journey.querySelectorAll('[data-journey-step]')];\n  const panels=[...journey.querySelectorAll('[data-journey-panel]')];\n  function selectJourney(index,moveFocus=false){\n   steps.forEach((step,i)=>{const active=i===index;step.setAttribute('aria-selected',String(active));step.tabIndex=active?0:-1;});\n   panels.forEach((panel,i)=>{panel.hidden=i!==index;panel.toggleAttribute('inert',i!==index);});\n   journey.dataset.journeyCurrent=String(index);\n   if(moveFocus)steps[index].focus();\n  }\n  steps.forEa 365,373],[1373,352],[1387,333],[1390,321],[1382,313],[1380,301],[1369,295],[1370,285]],[[1161,281],[1170,281],[1186,296],[1197,308],[1204,314],[1211,315],[1217,331],[1218,362],[1209,369],[1180,373],[1165,364],[1166,352],[1178,345],[1189,345],[1191,336],[1185,321],[1174,309],[1166,299]]]\n  };\n  let pinned='';\n  const buttons=[...commons.querySelectorAll('[data-role]')];\n  const stage=commons.querySelector('.commons-art-stage');\n  const imageSource=stage.querySelector('.commons-art-base').src;\n  const zones=[],regionButtons=[];\n  Object.entries(zoneMasks).forEach(([key,polygons])=>polygons.forEach(points=>{\n   const clip='polygon('+points.map(([x,y])=>(x/1668*100).toFixed(3)+'% '+(y/943*100).toFixed(3)+'%').join(',')+')';\n   const zone=document.createElement('img');zone.className='commons-zone';zone.dataset.zone=key;zone.alt='';zone.setAttribute('aria-hidden','true');zone.src=imageSource;zone.style.clipPath=clip;stage.append(zone);zones.push(zone);\n   const region=document.createElement('button');region.className='commons-region';region.dataset.region=key;region.tabIndex=-1;region.setAttribute('aria-label','查看'+roles[key].name+'共建方式');region.setAttribute('aria-controls','commonsContext');region.style.clipPath=clip;stage.append(region);regionButtons.push(region);\n  }));\n  function displayRole(key){\n   const role=roles[key];commons.dataset.focus=key||'';\n   buttons.forEach(b=>{\n    b.classList.toggle('is-focused',b.dataset.role===key);\n    b.setAttribute('aria-pressed',b.dataset.role===pinned?'true':'false');\n   });\n   zones.forEach(zone=>zone.classList.toggle('is-lit',zone.dataset.zone===key));\n   document.getElementById('commonsContext').textContent=role?role.text:'点击角色，高亮对应小组，查看共建方式。';\n  }\n  function bindControl(control,key){\n   control.setAttribute('aria-controls','commonsContext');\n   control.addEventListener('pointerenter',()=>displayRole(key));\n   control.addEventListener('pointerleave',()=>displayRole(pinned));\n   control.addEventListener('focus',()=>displayRole(key));\n   control.addEventListener('click',()=>{pinned=pinned===key?'':key;displayRole(pinned);});\n   control.addEventListener('blur',()=>displayRole(pinned));\n   control.addEventListener('keydown',e=>{\n    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;\n    e.preventDefault();e.stopPropagation();\n    const index=buttons.findIndex(b=>b.dataset.role===key);\n    const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowRight'?1:buttons.length-1))%buttons.length;\n    pinned=buttons[next].dataset.role;buttons[next].focus();displayRole(pinned);\n   });\n  }\n  buttons.forEach(b=>bindControl(b,b.dataset.role));\n  regionButtons.forEach(b=>bindControl(b,b.dataset.region));\n  commons.addEventListener('pointerleave',()=>displayRole(pinned));\n }\n document.querySelectorAll('.gallery').forEach(g=>{const tabs=[...g.querySelectorAll('[role=\"tab\"]')];function select(tab){tabs.forEach(b=>b.setAttribute('aria-selected',b===tab?'true':'false'));g.querySelectorAll('.gallery-panel').forEach(p=>{const selected=p.dataset.panel===tab.dataset.select;p.classList.toggle('active',selected);p.setAttribute('aria-hidden',selected?'false':'true');});}tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();const t=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];select(t);t.focus();});});});\n document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const key=e.key.toLowerCase();if(key==='escape'||key==='esc'){e.preventDefault();dialogs.forEach(d=>d.open&&d.close());document.body.classList.remove('hide-ui');return;}if(key==='o'){e.preventDefault();toggleDialog('overviewDialog');return;}if(key==='n'){e.preventDefault();toggleDialog('notesDialog');return;}if(dialogs.some(d=>d.open))return;if(key==='f
